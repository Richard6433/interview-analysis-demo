    const interpreted = ivs.filter(iv => (p.summaries?.[iv.slug] || {}).themes).length;
    const nf = (n) => Number(n || 0).toLocaleString();
    const kpi = (l, v, sub, go = "") => `<div class="kpi" ${go}><div class="l">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
    const kpis = `<div class="kpis">
      ${kpi("Interviews", nf(ivs.length), `${counts.done} analysed${counts.you ? ` · ${counts.you} need you` : ""}${counts.running ? ` · ${counts.running} running` : ""}`)}
      ${kpi("Words", words >= 10000 ? `${(words / 1000).toFixed(0)}K` : nf(words), "in the transcripts")}
      ${kpi("Profiles", nf((d?.profiles || []).length), `${(d?.profiles || []).filter(x => x.interviews).length} interviewed`)}
      ${kpi("Findings", nf(d?.findings), read ? `from ${read} interview${read > 1 ? "s" : ""}, every quote checked` : "after the first reading")}
      ${kpi("Themes", nf(p.codebook.themes), p.codebook.approved ? "approved by you" : p.codebook.exists ? "wait for your approval" : "not built yet")}
      ${kpi("Your decisions", nf(waiting), waiting ? "waiting in Review" : "nothing waits for you")}</div>`;
    // One bar per row, its length the value; the row is the hover target and says it in words.
    const max = (xs) => Math.max(1, ...xs);
    const bar = (segs, top, tip, label, side, flag = "") => {
      const total = segs.reduce((n, x) => n + x.n, 0), w = Math.round((68 * total) / top);
      return `<div class="brow" tabindex="0" data-ct="${esc(tip)}"><div class="bl">${label}</div><div class="btrack">${total
        ? `<span class="bbar" style="width:${w}%">${segs.filter(x => x.n).map(x => `<span class="bseg ${x.cls || ""}" style="flex:${x.n}"></span>`).join("")}</span>`
        : '<span class="bzero"></span>'}<span class="bval">${side}</span>${flag}</div></div>`;
    };
    const table = (head, rows) => `<details class="astable"><summary>As a table</summary><div class="wrap"><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>
      ${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? "num" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div></details>`;
    const flag = (t) => `<span class="flag">⚠ ${t}</span>`;
    const none = (t) => `<p class="muted" style="margin:6px 0">${t}</p>`;
    // What the interviews cover: findings per question.
    // With sub-questions, the findings outside them gather in one more row (not a question with little evidence).
    const hasSubs = (d?.sub_questions || []).length > 1;
    const sqs = (d?.sub_questions || []).map(x => x.id === "RQ" && hasSubs ? { ...x, id: "Other", label: "Outside the sub-questions", text: "Important, but outside the sub-questions", other: true } : x)
      .filter(x => !x.other || x.findings).sort((a, b) => (a.other ? 1 : 0) - (b.other ? 1 : 0));
    const topQ = max(sqs.map(x => x.findings));
    const covers = `<section class="card"><div class="chart-h"><h3>What each question has gathered</h3><span class="muted">findings</span></div>
      <p class="chart-sub">Findings per question, across every interview. A short bar is a question the interviews barely answer.</p>
      ${read ? sqs.map(x => bar([{ n: x.findings }], topQ, `${x.label}: ${x.findings} findings from ${x.interviews} interview(s). ${x.text}`,
          `<b>${esc(x.id)}</b> <small>${esc(x.text)}</small>`, `${x.findings} · ${x.interviews} int.`, x.findings < 3 && !x.other ? flag("little evidence") : "")).join("")
        + table(["Question", "Findings", "Interviews"], sqs.map(x => [`${x.id}. ${x.text}`, x.findings, x.interviews]))
        : none(hasSubs ? `${d.sub_questions.length - 1} sub-question${d.sub_questions.length > 2 ? "s" : ""}: filled once the first interview has been read.` : "Filled once the first interview has been read.")}</section>`;
    // Who was interviewed: interviews per profile.
    const profs = d?.profiles || [], noProf = ivs.filter(iv => !Object.values(iv.speakers || {}).some(sp => sp.role === "interviewee" && sp.profile)).length;
    const topP = max([...profs.map(x => x.interviews), noProf]);
    const who = `<section class="card"><div class="chart-h"><h3>Who you interviewed</h3><span class="muted">interviews</span></div>
      <p class="chart-sub">Interviews per profile. A profile with no bar is a kind of interviewee you have not reached yet.</p>
      ${profs.length || noProf ? profs.map(x => bar([{ n: x.interviews }], topP, `${x.text}: ${x.interviews} interview(s)`,
          `<b>${esc(x.id)}</b> <small>${esc(x.text)}</small>`, `${x.interviews}`, x.interviews ? "" : flag("not interviewed yet"))).join("")
        + (noProf ? bar([{ n: noProf, cls: "grey" }], topP, `${noProf} interview(s) without a profile yet`, "<small>Profile not given yet</small>", `${noProf}`) : "")
        + table(["Profile", "Interviews"], [...profs.map(x => [`${x.id}. ${x.text}`, x.interviews]), ...(noProf ? [["Profile not given yet", noProf]] : [])])
        : none("No profile yet: add them under Question and profiles, or let the transcript check suggest one.")}</section>`;
    // Themes: in how many interviews each one is central, or mentioned.
    const ths = d?.themes || [], topT = max(ths.map(t => t.central + t.mentioned)), shown = ths.slice(0, 12);
    const themes = `<section class="card"><div class="chart-h"><h3>Themes</h3>${p.codebook.exists ? '<button class="small" data-nav-go="codebook">Open the theme list</button>' : ""}</div>
      <p class="chart-sub">In how many interviews each theme is central, or only mentioned. The most present first.</p>
      ${ths.length && interpreted ? `<div class="legend-row"><span><i class="sw sup"></i>central</span><span><i class="sw light"></i>mentioned</span></div>
        ${shown.map(t => bar([{ n: t.central }, { n: t.mentioned, cls: "light" }], topT, `${t.name}: central in ${t.central}, mentioned in ${t.mentioned} interview(s)${t.group ? ` · ${t.group}` : ""}`,
          `${esc(t.name)}${t.group ? ` <small>${esc(t.group)}</small>` : ""}`, `${t.central} · ${t.mentioned}`)).join("")}
        ${ths.length > shown.length ? `<p class="muted" style="margin:6px 0 0">+ ${ths.length - shown.length} more themes · <button class="link" data-sec="themes">see every theme, interview by interview</button></p>` : ""}
        ${table(["Theme", "Central in", "Mentioned in"], ths.map(t => [t.name, t.central, t.mentioned]))}`
        : none(ths.length ? `${ths.length} themes in the list: shown here once an interview has been re-read against them.` : "Built by an agent once the first interview has been read.")}</section>`;
    // Earlier conclusions: supported, complicated or contradicted, interview by interview.
    const prs = d?.priors || [];
    const tested = (x) => x.supports + x.complicates + x.contradicts;
    const priors = `<section class="card"><div class="chart-h"><h3>Earlier conclusions</h3><span class="muted">interviews</span></div>
      <p class="chart-sub">How each conclusion you gave fares in the interviews.</p>
      ${prs.length ? `<div class="legend-row"><span><i class="sw sup"></i>supports</span><span><i class="sw mid"></i>complicates</span><span><i class="sw con"></i>contradicts</span></div>
        ${prs.map(x => `<div class="prow" tabindex="0" data-ct="${esc(`${x.text}: supported in ${x.supports}, complicated in ${x.complicates}, contradicted in ${x.contradicts} interview(s)`)}">
          <div class="bl">${esc(x.text)}</div>${tested(x) ? `<div class="dbar">${[["sup", x.supports], ["mid", x.complicates], ["con", x.contradicts]].filter(([, n]) => n).map(([c, n]) => `<span class="${c}" style="flex:${n}"></span>`).join("")}</div>
          <div class="bval">${x.supports} support · ${x.complicates} complicate · ${x.contradicts} contradict</div>` : `<div class="bval">${interpreted ? "not tested yet" : "tested once an interview is interpreted"}</div>`}</div>`).join("")}
        ${d?.unmatched ? `<p class="muted" style="margin:8px 0 0">${d.unmatched} test${d.unmatched > 1 ? "s" : ""} by the agents could not be matched to one of your conclusions, so ${d.unmatched > 1 ? "they are" : "it is"} not counted.</p>` : ""}
        ${table(["Conclusion", "Supports", "Complicates", "Contradicts"], prs.map(x => [x.text, x.supports, x.complicates, x.contradicts]))}`
        : none("None given. Add earlier conclusions (for example from desk research) under Question and profiles to test them.")}</section>`;
    // What is still missing, worked out from the numbers above.
    const gaps = [];
    if (!ivs.length) gaps.push(["Add your first interview: drop a transcript below", 'data-jump="interviews"']);
    if (read) sqs.filter(x => x.findings < 3 && !x.other).forEach(x => gaps.push([`${x.id === "RQ" ? "The research question" : x.id} has little evidence (${x.findings} finding${x.findings === 1 ? "" : "s"})`, ""]));
    profs.filter(x => !x.interviews).forEach(x => gaps.push([`No interview yet with profile ${x.id} (${x.role || x.text})`, ""]));
    if (noProf) gaps.push([`${noProf} interview${noProf > 1 ? "s have" : " has"} no profile yet`, ""]);
    if (interpreted) prs.filter(x => !tested(x)).forEach(x => gaps.push([`Not tested by any interview: “${x.text}”`, ""]));
    if (interpreted > 1 && !d?.stale && ths.some(t => t.central + t.mentioned)) { const thin = ths.filter(t => t.central + t.mentioned <= 1).length; if (thin) gaps.push([`${thin} theme${thin > 1 ? "s rest" : " rests"} on a single interview`, 'data-nav-go="codebook"']); }
    if (d?.stale) gaps.push([`${d.stale} interview${d.stale > 1 ? "s need" : " needs"} re-reading against the current theme list`, 'data-sec="themes"']);
    if (d?.misses) gaps.push([`The agents noted ${d.misses} topic${d.misses > 1 ? "s" : ""} the theme list does not cover`, 'data-nav-go="codebook"']);
    const approved = ivs.filter(iv => iv.final_approved).length;
    if (ivs.length && approved < 2) gaps.push([`The comparison needs 2 approved interviews (${approved} so far)`, ""]);
    if (waiting) gaps.push([`${waiting} decision${waiting > 1 ? "s wait" : " waits"} for you`, 'data-nav-go="review"']);
    const missing = `<section class="card wide ${gaps.length ? "attn" : ""}" id="sec-missing"><h3>What is still missing</h3>
      ${gaps.length ? `<ul class="gaps">${gaps.map(([t, go]) => `<li><span class="gi" aria-hidden="true">⚠</span><span>${esc(t)}</span>${go ? `<button class="small" ${go}>Open</button>` : "<span></span>"}</li>`).join("")}</ul>`
        : '<p class="muted"><span style="color:var(--ok)">✓</span> Nothing obvious is missing: every question has evidence, every profile is interviewed, every conclusion is tested.</p>'}</section>`;
    return `${errorBox()}<div class="spread"><h2 class="pg" style="margin:0">${esc(p.name)}</h2><span class="row">${(d?.grid || []).length ? '<button class="small" data-act="slides">▶ Present</button>' : ""}<button class="small" data-nav-go="overviewText">Text version</button></span></div>
      <p class="lede" style="margin-top:4px">${esc(p.question)}</p>
      ${freshCard(p)}${d ? `${kpis}<div class="dash">${missing}${covers}${who}${themes}${priors}</div>`
        : `<div class="error">The dashboard's numbers could not be loaded (${esc(dErr || "no answer")}). <button class="small" data-act="dash-retry">Try again</button>
            <button class="small" data-nav-go="overviewText">Open the text version</button></div>`}
      <section class="card" id="sec-interviews"><div class="spread"><h3 style="margin:0">Where every interview stands</h3>
          <span class="muted">★ you · ● running · ✓ done · ✕ stopped · ○ not started</span></div>
        ${mapTable(p)}${dropZone(p)}</section>
      ${flowCard(p)}
      <details class="card" id="settings"><summary>Project settings: rename or delete the project</summary>
        <div style="margin-top:10px">${icard({ id: "name", title: "Project name", src: "you", what: "Shown in the menu and on the reports.",
          body: `<p class="value">${esc(p.name)}</p>`, editor: `<label class="field" for="ed-name">Project name</label><input type="text" id="ed-name" value="${esc(p.name)}">` })}</div>
        ${deleteCard(p)}</details>`;
  },

  overviewText() {  // the overview as text: kept to compare with the dashboard
    const p = project, ivs = visibleInterviews(p);
    const words = ivs.reduce((n, iv) => n + (iv.words || 0), 0);
    const counts = Object.fromEntries(["done", "running", "you", "failed", "todo"].map(k => [k, ivs.filter(iv => ivStatus(p, iv).state === k).length]));
    const map = mapTable(p);
    return `${errorBox()}<h2 class="pg">${esc(p.name)}</h2>
      <p class="lede"><b>Research question:</b> ${esc(p.question)} <button class="link" data-nav-go="context">Question and profiles</button></p>
${freshCard(p)}      <section class="card" id="sec-interviews"><div class="spread"><h3 style="margin:0">Where every interview stands <span class="count">${ivs.length}</span></h3>
          <span class="muted">${words.toLocaleString()} words · ${counts.done} analysed · ${counts.you} need you · ${counts.running} running${counts.failed ? ` · ${counts.failed} stopped` : ""}</span></div>
        ${ivs.length ? `<p class="muted legend" style="margin:6px 0 4px">Every interview goes through the same five phases, left to right. Click a phase to see its steps.
          ★ your decision · ● running · ✓ done · ✕ stopped · ○ not started</p>` : ""}
        ${map}
${dropZone(p)}</section>
${flowCard(p)}
      <details class="card" id="pipeline"><summary>How each interview is processed: the ${STEP_ORDER.length} steps, who does each, and what it produces</summary>
        ${PHASES.map((ph, i) => `<h4>${i + 1}. ${ph.name}</h4>${ph.steps.map(id => { const G = STEP_GUIDE[id], who = KIND_OF[id] ? "you" : ({ extract: "program", list: "program", split: "program", checks: "program", counts: "program" }[id] || "agent");
          return `<div class="pipe"><span class="who">${WHO_ICON[who]} ${WHO_KIND[who]}</span><div><b>${esc(G.title)}</b><div class="muted">${G.what}</div><div class="muted"><b>Produces:</b> ${G.produces}</div></div></div>`; }).join("")}`).join("")}</details>
      <details class="card" id="settings"><summary>Project settings: rename or delete the project</summary>
        <div style="margin-top:10px">${icard({ id: "name", title: "Project name", src: "you", what: "Shown in the menu and on the reports.",
          body: `<p class="value">${esc(p.name)}</p>`, editor: `<label class="field" for="ed-name">Project name</label><input type="text" id="ed-name" value="${esc(p.name)}">` })}</div>
      ${deleteCard(p)}</details>`;
  },

  async check() {
    const iv = project.interviews.find(x => x.slug === view.slug);
    if (!iv) return GONE;
    const m = cache.meta ??= await api(`projects/${view.pid}/file/meta/${view.slug}`);
    const done = iv.check_approved;
    const list = (key, title, hint) => `<h4>${title}</h4>${hint ? `<p class="muted">${hint}</p>` : ""}
      ${(m[key] || []).length ? `<div class="pill-list">${m[key].map((x, i) => `<span>${esc(x)}${done ? "" : `<button data-del="${key}" data-i="${i}" aria-label="Remove">✕</button>`}</span>`).join("")}</div>` : '<p class="muted">None found.</p>'}`;
    const who = Object.values(iv.speakers || {}).find(x => x.role === "interviewee");
    const sugg = project.summaries?.[iv.slug]?.suggested_profile || {};
    const needProfile = !done && who && !who.profile;
    const look = [["speaker_corrections", "Lines with the wrong speaker label"], ["meaning_critical_readings", "Sentences that may say the opposite of what was meant"],
                  ["interviewer_talking", "Where an interviewer does the talking"]].filter(([k]) => (m[k] || []).length);
    return `${errorBox()}${view.screen === "review" ? "" : `<h2 class="pg">${esc(iv.label)} · transcript check</h2>`}
      ${done ? banner("Confirmed. The analysis carries on by itself.", "Status") : ""}
      ${consentCard(m, done)}
      <div class="card attn"><div class="spread"><h3 style="margin:0">${done ? "What was flagged" : "Worth a look before you confirm"}</h3>${done ? "" : aiActions(`check:${iv.slug}`, "the transcript check")}</div>
        ${look.length ? look.map(([k, t]) => `<h4>${t}</h4>${m[k].map((x, i) => `<div class="item spread" style="flex-wrap:nowrap"><span>${esc(x)}</span>${done ? "" : `<button class="small" data-del="${k}" data-i="${i}">✕ Remove this note</button>`}</div>`).join("")}`).join("")
          : '<p class="muted">Nothing unusual: no line under the wrong speaker, no sentence that may say the opposite.</p>'}
        ${needProfile ? `<h4>The interviewee's profile ${kindTag("def")}</h4>
          <p class="muted">Suggested by the agent from what ${esc(who.label)} says about themselves. Keep it, edit it, or pick an existing profile.</p>
          <label class="field" for="cp-pick">Profile</label><select id="cp-pick">
            <option value="new" selected>The suggested profile (below)</option>
            ${(project.profiles || []).map(pr => `<option value="${esc(pr.id)}">${esc(profileText(pr))}</option>`).join("")}</select>
          <div class="grid stack" style="margin-top:8px">${[["role", "Role or position"], ["org_type", "Type of organisation"], ["sector", "Sector"]].map(([k, t]) =>
            `<div><label class="field" for="cp-${k}">${t}</label><textarea id="cp-${k}" rows="${Math.min(4, Math.max(1, Math.ceil(String(sugg[k] || "").length / 70)))}">${esc(sugg[k] || "")}</textarea></div>`).join("")}</div>
          ${tooExact(sugg) ? `<p class="slow">${esc(tooExact(sugg))} The profile goes into every shareable result: a general kind of role is safer.</p>` : ""}`
          : who && who.profile ? `<p class="muted">Interviewee: ${esc(profileText(who.profile))}</p>` : ""}
      </div>
      <details class="more" id="check-other-notes"><summary>The agent's other notes: who is who, misheard words, weak evidence, names to hide</summary>
      <div class="card"><h2>${esc(iv.label)}: transcript check</h2>
        <p class="muted">Done by an agent ${tip("Every later agent is given these notes. The notes are a default: remove anything wrong. Confirming them is your decision.")}</p>
        <h4>Who is who</h4><div class="wrap"><table><tr><th>Speaker label</th><th>Role</th></tr>
          ${Object.entries(m.speaker_map || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td><input type="text" data-role="${esc(k)}" value="${esc(v)}" ${done ? "disabled" : ""} aria-label="Role of ${esc(k)}"></td></tr>`).join("")}</table></div>
        <h4>Misheard words</h4>${Object.keys(m.misheard_words || {}).length ? `<div class="pill-list">${Object.entries(m.misheard_words).map(([k, v]) => `<span>${esc(k)} → ${esc(v)}${done ? "" : `<button data-delmap="misheard_words" data-k="${esc(k)}" aria-label="Remove">✕</button>`}</span>`).join("")}</div>` : '<p class="muted">None found.</p>'}
        ${list("leading_questions_weak_evidence", "Agreement with an interviewer's idea (weak evidence)")}
        ${list("identifying_terms", "Names that could identify someone", "Hidden as [name] in every shareable result. Missing one? Add it: a job title, a town, a nickname, a spelling variant.")}
        <div class="row add-term"><input type="text" id="add-term" placeholder="e.g. Head of Data, a town, a nickname" aria-label="A name to hide">
          <button class="small" data-act="add-term">Add to the names to hide</button></div>
      </div></details>
      ${done ? "" : `<div class="row actions"><span class="rule">Remove any wrong note, settle the profile if asked, then confirm.</span>
        <button class="primary" data-act="approve-check" ${busyWith(project, `${iv.slug}:check`) ? "disabled title=\"The check is being made again\"" : ""}>Confirm and continue</button></div>`}`;
  },

  async codes() {
    const iv = project.interviews.find(x => x.slug === view.slug);
    if (!iv) return GONE;
    const forms = cache.codes ??= await api(`projects/${view.pid}/file/codes/${view.slug}`);
    return `${errorBox()}<div class="card"><div class="spread"><h2 style="margin:0">${esc(iv.label)}: what the five readers found</h2><span class="row">${srcTag("ai")}${aiActions(`read:${iv.slug}`, "the five readers")}</span></div>
      <p class="muted">Every quote checked word for word. Click ✎ to reword a finding, or Remove one that is wrong: the AI's original is kept. ${tip("The program found each quote in the transcript. Each finding also says how sure its reader is (high, medium, low) and why.")}</p>
      ${(() => { const all = Object.values(forms).filter(Boolean).flatMap(f => f.codes);
        const n = (lv) => all.filter(c => c.confidence === lv).length;
        return all.some(c => c.confidence) ? `<div class="row"><span class="tag ok">high: ${n("high")}</span><span class="tag plain">medium: ${n("medium")}</span>
          <span class="tag grey">low: ${n("low")}</span>${all.length - n("high") - n("medium") - n("low") ? `<span class="muted">${all.length - n("high") - n("medium") - n("low")} without a level (coded before confidence was asked)</span>` : ""}</div>` : ""; })()}</div>
      ${(() => { const all = Object.values(forms).filter(Boolean).flatMap(f => f.codes);
        const sqs = [...new Set(all.map(c => c.sub_question).filter(Boolean))].sort();
        const sel = (id, label, opts) => `<label class="muted">${label} <select id="${id}">${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("")}</select></label>`;
        return `<div class="card filters"><div class="row">
          <input type="text" id="f-text" placeholder="Search the findings and quotes" style="flex:1;min-width:200px" aria-label="Search">
          ${sel("f-conf", "Confidence", [["", "all"], ["high", "high"], ["medium", "medium"], ["low", "low"]])}
          ${sel("f-reader", "Reader", [["", "all"], ...["A", "B", "C", "D", "E"].map(x => [x, x])])}
          ${sqs.length > 1 ? sel("f-sq", "Question", [["", "all"], ...sqs.map(x => [x, x])]) : ""}</div>
          <div class="muted" id="f-count" style="margin-top:6px">${all.length} findings</div></div>`; })()}
      ${Object.entries(forms).filter(([, f]) => f).map(([r, f]) => `<div class="card reader-card"><h3>${r === "E" ? "Reader E: the whole interview" : `Reader ${r}: part ${r}`} <span class="muted">· ${f.codes.length} findings · ${esc(f.chunk.span || "")}</span></h3>
        ${f.codes.map((c, i) => `<div class="item finding ${c.removed_by_researcher ? "removed" : ""}" data-conf="${esc(c.confidence || "")}" data-reader="${r}" data-sq="${esc(c.sub_question || "")}"
            data-text="${esc([c.code, c.description, ...(c.excerpts || [])].join(" ").toLowerCase())}"><div class="spread"><div><b>${etext(`c-${r}-${i}-code`, c.code, { kind: "codes", slug: view.slug, part: r, path: ["codes", i, "code"] }, origOf(c, "code"), false)}</b> <span class="muted">· ${esc(c.valence)} · ${esc(c.sub_question)}${String(c.evidence_strength || "").startsWith("weak") ? " · weak evidence" : ""}</span></div>
          <span class="row">${c.confidence ? `<span class="tag ${CONF[c.confidence] || "grey"}">confidence: ${esc(c.confidence)}</span>` : ""}
          <button class="small" data-fremove="${esc(view.slug)}|${r}|${i}|${c.removed_by_researcher ? 0 : 1}">${c.removed_by_researcher ? "Put back" : "Remove"}</button></span></div>
          ${c.removed_by_researcher ? '<div class="muted"><b>Removed by you:</b> left out of the results now, and of the theme list the next time it is built.</div>' : ""}
          ${c.confidence_reason ? `<div class="muted"><b>Why:</b> ${esc(c.confidence_reason)}</div>` : ""}
          <div>${etext(`c-${r}-${i}-d`, c.description, { kind: "codes", slug: view.slug, part: r, path: ["codes", i, "description"] }, origOf(c, "description"))}</div>${(c.excerpts || []).map(x => `<blockquote>“${esc(x)}” <span class="srcl">${esc(c.speaker)}, ${esc(c.timestamp)}</span></blockquote>`).join("")}
          ${c.interpretation ? `<div class="muted"><b>Interpretation:</b> ${etext(`c-${r}-${i}-i`, c.interpretation, { kind: "codes", slug: view.slug, part: r, path: ["codes", i, "interpretation"] }, origOf(c, "interpretation"))}</div>` : ""}</div>`).join("")}</div>`).join("")}
      <div class="row"><button data-act="back">← Back</button></div>`;
  },

  async codebook() {
    const cb = cache.cb ??= await api(`projects/${view.pid}/file/codebook`);
    const st = project.codebook, done = st.approved;
    const byId = Object.fromEntries((cb.themes || []).map(t => [t.id, t]));
    const idx = Object.fromEntries((cb.themes || []).map((t, i) => [t.id, i]));
    const grouped = new Set((cb.groups || []).flatMap(g => g.themes));
    const theme = (t) => `<div class="item"><div class="row"><span class="muted">${esc(t.id)}</span>
        <b>${etext(`t-${t.id}-n`, t.name, { kind: "codebook", path: ["themes", idx[t.id], "name"] }, origOf(t, "name"), false)}</b>
        <span class="grow"></span>${cb.frozen ? "" : themeAsk === t.id
          ? `<span class="row"><span class="muted">The list is approved: removing this theme means approving it again, and the interviews are then re-read.</span>
              <button class="small" data-trm-cancel="1">Cancel</button><button class="small primary" data-trm-go="${esc(t.id)}">Remove it</button></span>`
          : `<button class="small" data-trm="${esc(t.id)}" title="Take this theme out; its findings become 'not placed'. You can put it back.">Remove</button>`}</div>
        <div>${etext(`t-${t.id}-d`, t.definition, { kind: "codebook", path: ["themes", idx[t.id], "definition"] }, origOf(t, "definition"))}</div>
        <details><summary>${t.sub_themes.length} sub-themes, ${t.sub_themes.reduce((n, s) => n + s.representative_codes.length, 0)} findings</summary>
          ${t.sub_themes.map(s => `<div style="margin:6px 0 0 12px"><b>${esc(s.id)} ${esc(s.name)}</b><div class="muted">${s.representative_codes.map(esc).join(" · ")}</div></div>`).join("")}</details></div>`;
    return `${errorBox()}${done ? banner(st.frozen ? "The theme list is frozen." : "Approved. The re-reads run by themselves.", "Status")
        : ""}
      <div class="card"><div class="spread"><h2 style="margin:0">Theme list ${tip("A theme is a pattern across what was said, named as a mechanism ('policy exists but nobody has read it'), not a topic. Sub-themes group the findings it rests on; main themes group the themes.")}</h2><span class="row">${srcTag("ai")}${cb.frozen ? "" : aiActions("codebook", "the theme list")}</span></div>
        <p class="muted">Click ✎ to reword a theme or a main theme: the AI's original is kept, and an approved list stays approved.</p>
        <p class="muted">From every finding of ${st.includes.length} interview(s) · built ${esc(cb.built)} · ${cb.frozen ? "frozen" : st.approved ? "approved" : "waiting for your approval"}</p></div>
      ${done ? "" : (() => { const thin = (cb.themes || []).filter(t => t.sub_themes.reduce((k, x) => k + x.representative_codes.length, 0) < 3);
        const ungrouped = (cb.themes || []).filter(t => !grouped.has(t.id));
        return `<div class="card attn"><h3>Worth a look before you approve</h3>
          ${thin.length ? `<h4>Themes resting on fewer than 3 findings</h4>${thin.map(t => `<div class="item">${esc(t.id)} ${etext(`tw-${t.id}`, t.name, { kind: "codebook", path: ["themes", idx[t.id], "name"] }, origOf(t, "name"), false)}</div>`).join("")}` : ""}
          ${(cb.unplaced || []).length ? `<h4>Findings placed in no theme</h4><div class="item">${cb.unplaced.length} finding${cb.unplaced.length > 1 ? "s" : ""} <button class="link" data-jump="unplaced">see them below</button></div>` : ""}
          ${ungrouped.length ? `<h4>Themes in no main theme</h4>${ungrouped.map(t => `<div class="item">${esc(t.name)}</div>`).join("")}` : ""}
          ${!thin.length && !(cb.unplaced || []).length && !ungrouped.length ? '<p class="muted">Nothing unusual: every theme rests on 3 findings or more, every finding is placed.</p>' : ""}
          <p class="muted">Then read the main themes below; rename any that do not fit.</p></div>`; })()}
      ${(cb.groups || []).map((g, gi) => `<div class="card group" style="--gc: var(--g${(gi % 6) + 1})"><div class="row"><span class="gtag">${esc(g.id)}</span>
          <h3>${etext(`g-${gi}`, g.name, { kind: "codebook", path: ["groups", gi, "name"] }, origOf(g, "name"), false)}</h3></div>
          <p>${esc(g.tests)}</p>${g.themes.map(id => byId[id]).filter(Boolean).map(theme).join("")}</div>`).join("")}
      ${(cb.themes || []).some(t => !grouped.has(t.id)) ? `<div class="card"><h3>Not in a main theme</h3>${cb.themes.filter(t => !grouped.has(t.id)).map(theme).join("")}</div>` : ""}
      ${(cb.removed_by_researcher || []).length ? `<div class="card off-card"><h3>Removed by you</h3>
          <p class="muted">Left out of the analysis; the agents will not recreate them. Their findings are listed under "not placed" below.</p>
          ${cb.removed_by_researcher.map(r => `<div class="item spread"><span><b>${esc(r.theme.name)}</b> <span class="muted">· ${esc(r.theme.definition || "")}</span></span>
            ${cb.frozen ? "" : `<button class="small" data-trs="${esc(r.theme.id)}">Put back</button>`}</div>`).join("")}</div>` : ""}
      ${(cb.unplaced || []).length ? `<div class="card" id="sec-unplaced"><h3>Findings not placed in a theme</h3>${cb.unplaced.map(u => `<div class="item"><b>${esc(u.code)}</b><div class="muted">${esc(u.reason)}</div></div>`).join("")}</div>` : ""}
      ${done ? "" : `<div class="row actions"><span class="rule">Reword any wrong theme (✎), then approve.</span>
        <label class="opt freeze"><input type="checkbox" id="freeze"> <b>Freeze the list</b> ${tip("Frozen: final, later interviews no longer add themes. Not frozen: each new interview extends the list, and every interview is re-read after you approve it again.")}</label>
        ${busyWith(project, "codebook") ? `<span class="muted">${spinner} Wait: the theme list is being made again.</span>` : ""}
        <button class="primary" data-act="codebook-approve" ${busyWith(project, "codebook") ? "disabled" : ""}>Approve</button></div>`}`;
  },

  async final() {
    const iv = project.interviews.find(x => x.slug === view.slug);
    if (!iv) return GONE;
    const d = cache.final ??= await api(`projects/${view.pid}/file/final/${view.slug}`);
    const r = d.recode || {}, l = d.latent || {}, done = iv.final_approved;
    const q = (x) => x && x.text ? `<blockquote>“${esc(x.text)}”${x.speaker ? ` (${esc(x.speaker)}` : " ("}${x.timestamp ? `, ${esc(x.timestamp)}` : ""})</blockquote>` : "";
    const LV = { primary: ["ok", "central"], secondary: ["plain", "present"], tangential: ["grey", "minor"], absent: ["grey", "absent"] };
    return `${errorBox()}${view.screen === "review" ? "" : `<h2 class="pg">${esc(iv.label)} · re-read and behind the lines</h2>`}
      ${done ? banner("Approved. This interview is part of the findings report.", "Status") : ""}
      ${(() => { const fixes = r.corrections_to_earlier_coding || [], misses = r.themes_the_codebook_misses || [];
        const lowr = (l.readings || []).filter(x => x.confidence === "low");
        const against = (l.desk_research_check || []).filter(x => ["complicates", "contradicts"].includes(x.does_this_interview_support_it));
        return `<div class="card attn"><div class="spread"><h3 style="margin:0">${done ? "What was flagged" : "Worth a look before you approve"}</h3>
            <span class="row"><span class="muted">Re-read:</span>${aiActions(`reread:${iv.slug}`, "the re-read")}
              <span class="muted">Behind the lines:</span>${aiActions(`latent:${iv.slug}`, "behind the lines")}</span></div>
          ${fixes.length ? `<h4>Where the re-read disagrees with the first reading</h4>
            <p class="muted">Notes from the AI, not changes: nothing was changed by itself. The full re-read (folded below) already takes them into account.</p>
            ${fixes.map(x => `<div class="item"><b>${esc(x.what_was_coded)}</b><div>${esc(x.what_the_full_reading_shows)}</div></div>`).join("")}
            <div class="row"><span class="muted"><b>What you can do:</b> if a note says a theme overstates something or two themes overlap, reword the theme (✎) on the theme list;
              if it is about one finding, reword the finding (✎) in the five readings. Otherwise nothing.</span>
              <button class="small" data-go="codebook">Open the theme list</button><button class="small" data-go="codes" data-slug="${esc(iv.slug)}">Open the five readings</button></div>` : ""}
          ${misses.length ? `<h4>Topics in this interview that no theme covers</h4>${misses.map(x => `<div class="item">${esc(x.description)}</div>`).join("")}
            <div class="row"><span class="muted"><b>What you can do:</b> nothing, if it is minor; if it matters, ask for a theme that covers it with ✦ Refine on the theme list.</span>
              <button class="small" data-go="codebook">Open the theme list</button></div>` : ""}
          ${against.length ? `<h4>Earlier conclusions this interview complicates or contradicts</h4>${against.map(x => `<div class="item"><b>${esc(x.prior_conclusion)}</b> <span class="tag plain">${esc(x.does_this_interview_support_it)}</span><div class="muted">${esc(x.note)}</div></div>`).join("")}` : ""}
          ${lowr.length ? `<h4>Readings behind the lines with low confidence</h4>${lowr.map(x => { const i = (l.readings || []).indexOf(x);
            return `<div class="item">${etext(`lw-${i}`, x.reading || "", { kind: "latent", slug: iv.slug, path: ["readings", i, "reading"] }, origOf(x, "reading"))}</div>`; }).join("")}` : ""}
          ${!fixes.length && !misses.length && !against.length && !lowr.length ? '<p class="muted">Nothing unusual: no correction, nothing the theme list misses, no low-confidence reading.</p>' : ""}
          <h4>In one paragraph</h4><p>${l.synthesis || !r.document_summary
            ? etext("l-syn-top", l.synthesis || "", { kind: "latent", slug: iv.slug, path: ["synthesis"] }, origOf(l, "synthesis"))
            : etext("r-sum-top", r.document_summary || "", { kind: "recode", slug: iv.slug, path: ["document_summary"] }, origOf(r, "document_summary"))}</p></div>`; })()}
      <details class="more"><summary>The full re-read and the reading behind the lines ${kindTag("info")}</summary>
      <div class="card"><div class="spread"><h2 style="margin:0">${esc(iv.label)}: re-read against the themes</h2>${srcTag("ai")}</div>
        <p class="muted">Done by an agent, checked by the program. Click ✎ to reword: the AI's original is kept.</p>
        <p>${etext("r-sum", r.document_summary || "", { kind: "recode", slug: iv.slug, path: ["document_summary"] }, origOf(r, "document_summary"))}</p>
        ${(r.theme_codings || []).map((c, i) => `<div class="item"><div class="spread"><b>${esc(c.theme_id)} ${esc(c.theme_name)}</b>
          <span class="tag ${(LV[c.relevance] || ["grey"])[0]}">${(LV[c.relevance] || ["", c.relevance])[1]}</span></div>
          <div>${etext(`r-${i}`, c.summary || "", { kind: "recode", slug: iv.slug, path: ["theme_codings", i, "summary"] }, origOf(c, "summary"))}</div>${q(c.best_quote)}<div class="muted">Fit with the theme list: ${esc(c.codebook_fit)}. ${esc(c.fit_note)}</div></div>`).join("")}
        <h4>Topics in this interview that no theme covers</h4>${(r.themes_the_codebook_misses || []).map(x => `<div class="item">${esc(x.description)}</div>`).join("") || '<p class="muted">None.</p>'}
        <h4>Where the re-read disagrees with the first reading (notes, nothing changed by itself)</h4>${(r.corrections_to_earlier_coding || []).map(x => `<div class="item"><b>${esc(x.what_was_coded)}</b><div>${esc(x.what_the_full_reading_shows)}</div></div>`).join("") || '<p class="muted">None.</p>'}</div>
      <div class="card"><div class="spread"><h2 style="margin:0">Behind the lines</h2>${srcTag("ai")}</div>
        <p class="muted">Done by an agent, checked by the program.</p>
        <p>${etext("l-syn", l.synthesis || "", { kind: "latent", slug: iv.slug, path: ["synthesis"] }, origOf(l, "synthesis"))}</p>
        ${(l.readings || []).map((x, i) => `<div class="item"><div class="spread"><b>${etext(`l-${i}`, x.reading || "", { kind: "latent", slug: iv.slug, path: ["readings", i, "reading"] }, origOf(x, "reading"), false)}</b><span class="tag ${x.confidence === "high" ? "ok" : x.confidence === "medium" ? "plain" : "grey"}">confidence: ${esc(x.confidence)}</span></div>
          ${(x.surface_evidence || []).map(q).join("")}<div class="muted"><b>Would refute it:</b> ${esc(x.what_would_refute_this)}<br><b>Other reading:</b> ${esc(x.alternative_reading)}</div></div>`).join("")}
        <h4>Silences</h4>${(l.silences || []).map(x => `<div class="item"><b>${esc(x.what_is_absent)}</b> <span class="muted">· asked: ${esc(x.was_it_asked)}</span><div class="muted">${esc(x.why_it_is_notable)}</div></div>`).join("") || '<p class="muted">None.</p>'}
        ${(l.desk_research_check || []).length ? `<h4>Earlier conclusions</h4>${l.desk_research_check.map(x => `<div class="item"><div class="spread"><b>${esc(x.prior_conclusion)}</b><span class="tag plain">${esc(x.does_this_interview_support_it)}</span></div>${q(x.evidence)}<div class="muted">${esc(x.note)}</div></div>`).join("")}` : ""}</div>
      </details>
      <div class="row actions">${done ? `<button data-act="reopen-final">Change my approval</button>`

               : `<span class="rule">Reword anything wrong (✎), then approve.</span><button class="primary" data-act="approve-final">Approve</button>`}</div>`;
  },

  async results() {

    const label = Object.fromEntries(p.interviews.map(iv => [iv.slug, iv.label]));

    if (p.codebook.exists) { const cb = cache.cbx ??= await api(`projects/${view.pid}/file/codebook`); (cb.themes || []).forEach(t => { names[t.id] = t.name; });
      (cb.removed_by_researcher || []).forEach(r => { names[r.theme.id] ??= `${r.theme.name} (removed)`; }); }
    const R = p.reports.length ? (cache.rt ??= await api(`projects/${view.pid}/file/report-text`).catch(() => ({}))) : null;
    const Q = cache.quotes ??= await api(`projects/${view.pid}/quotes`);
    const D = cache.dash ??= await api(`projects/${view.pid}/dashboard`).catch(() => ({ grid: [], themes: [], groups: [] }));
    const who = (xs) => (xs || []).map(x => esc(label[x] || x)).join(", ");
    const ready = c.approved.length >= 2, old = c.exists && (p.context_changed_at || 0) > (job.ended_at || 0);
    const waitingApproval = queue(p).filter(x => x.key.endsWith(":approve-final")).length;
    const X = (id, value, path, item, key, multi = true) => etext(id, value || "", { kind: "cross", path }, origOf(item, key), multi);
    const pairs = (xs) => `<ul class="pairs">${(xs || []).map(x => `<li><b>${esc(x[0] || "")}</b>${esc(x.slice(1).join(""))}</li>`).join("")}</ul>`;
    const only = view.step === "quotes" && view.slug ? view.slug : "";
    const mine = Q.items.filter(x => !only || x.slug === only);
    const problems = mine.filter(x => x.status !== "verified"), qok = mine.filter(x => x.status === "verified");
    const QS = { verified: ["ok", "✓ Verified"], partial: ["warn", "≈ Partial match"], not_found: ["bad", "✗ Not found"], off_record: ["bad", "⚠ Off the record"] };
    const o = store.get("analysis-results-v2", { content: "report", format: "xlsx" });
    const rjob = p.report_job || {};
    return `${errorBox()}<h2 class="pg">Results</h2>
      <p class="lede">The comparison across interviews, the final analysis, every quote checked, and the files to download.</p>

        <button data-jump="quotes">Quote check <span class="tag ${Q.count.not_found || Q.count.off_record ? "bad" : Q.count.partial ? "warn" : "ok"}">${Q.count.off_record ? `${Q.count.off_record} off the record` : Q.count.not_found ? `${Q.count.not_found} not found` : `${Q.count.verified} of ${Q.total} verified`}</span></button>
        <button data-jump="export">Export</button></nav>

      <section class="card" id="sec-themes"><div class="spread"><h3 style="margin:0">Theme analysis</h3>
          ${(D.grid || []).length ? '<button class="primary" data-act="slides">▶ Present the results</button>' : ""}</div>
        <p class="what">Which themes recur, interview by interview. It grows with each interview re-read against the theme list.
          Click a theme to preview what the interviews say about it.</p>
        ${themeGrid(D, d)}
        ${d && (d.patterns || []).length ? `<h4>Shared patterns</h4><p class="chart-sub">Ranked by how many interviews share them. Open one to read its evidence.</p>${patternRows(d, D, label)}` : ""}</section>

        ${!ready ? `<div class="banner"><b>Next step:</b> approve at least two interviews (${c.approved.length} so far). It then runs by itself.</div>`

        ${d ? `<div class="meta"><span>Built</span> ${esc(d.built)} <span>From</span> ${who(d.interviews)}</div>
          <h4>Overview</h4><p>${X("cx-ov", d.overview, ["overview"], d, "overview")}</p>
          <details id="cx-bytheme"><summary>Theme by theme, as text (to read in full or reword)</summary>${(d.by_theme || []).map((t, i) => `<div class="item"><b>${esc(names[t.theme_id] || t.theme_id)}</b>
            <div><span class="muted">Shared:</span> ${X(`cx-t${i}s`, t.shared, ["by_theme", i, "shared"], t, "shared")}</div>
            <div><span class="muted">Differences:</span> ${X(`cx-t${i}d`, t.differences, ["by_theme", i, "differences"], t, "differences")}</div>
            <div><span class="muted">By profile:</span> ${X(`cx-t${i}p`, t.by_profile, ["by_theme", i, "by_profile"], t, "by_profile")}</div></div>`).join("")}</details>
          <details><summary>By profile, shared patterns, where they differ, limits</summary>
            <h4>By profile</h4>${(d.by_profile || []).map((x, i) => `<div class="item"><b>${esc(x.profile)}</b><div>${X(`cx-p${i}`, x.what_stands_out, ["by_profile", i, "what_stands_out"], x, "what_stands_out")}</div></div>`).join("")}
            <h4>Shared patterns</h4>${(d.patterns || []).map((x, i) => `<div class="item"><b>${X(`cx-s${i}`, x.pattern, ["patterns", i, "pattern"], x, "pattern", false)}</b> <span class="muted">· ${who(x.interviews)}</span>
              ${(x.evidence || []).map(e => `<blockquote>“${esc(e.text)}” (${esc(label[e.slug] || e.slug)})</blockquote>`).join("")}</div>`).join("")}
            <h4>Where they differ</h4>${(d.divergences || []).map((x, i) => `<div class="item"><b>${esc(x.about)}</b> <span class="muted">· ${who(x.interviews)}</span><div>${X(`cx-v${i}`, x.how_they_differ, ["divergences", i, "how_they_differ"], x, "how_they_differ")}</div></div>`).join("")}
            <h4>Limits</h4><p>${X("cx-lim", d.limits, ["limits"], d, "limits")}</p></details>` : ""}</section>

// A first answer to "who is who", so the researcher only checks it: interviewers already named in
// the project's other interviews are interviewers again; of the rest, the one who talks most is the
// interviewee, the others interviewers. "Speaker 1"-style labels mean someone different in each
// transcript, so they are never remembered. The only profile not used yet is pre-selected.
function guessSpeakers(p, iv, labels) {
  const generic = /^(speaker|participant|interlocutor|person|\(no speaker names\))\s*\d*$/i;
  const known = {};
  p.interviews.filter(o => o.slug !== iv.slug).forEach(o => Object.values(o.speakers || {}).forEach(sp => {
    if (sp.role !== "interviewee" && !generic.test(sp.label)) known[sp.label] = sp.role;
  }));
  const out = {};
  labels.forEach(l => { if (known[l.label]) out[l.label] = { role: known[l.label] }; });
  const rest = labels.filter(l => !out[l.label]).sort((a, b) => (b.words || 0) - (a.words || 0));
  // No profile is pre-selected: with several new interviews, one typed profile would be given to all of them.
  rest.forEach((l, i) => { out[l.label] = { role: i === 0 ? "interviewee" : "interviewer" }; });
  return out;
}

let renderGen = 0;
async function render() {
  const gen = ++renderGen;

  const name = view.screen in screens ? view.screen : "home";
  if (!["home", "new", "setup"].includes(name) && !project) { view = { screen: "home" }; return render(); }
  const side = document.getElementById("side"), layout = document.getElementById("layout");
  const key0 = `${name}|${view.slug || ""}`;
  const alone = ["setup", "new"].includes(name);  // "Before you start" and a new project stand on their own
  side.hidden = alone;
  layout.classList.toggle("noside", alone);
  const sq = document.getElementById("psearch"), sv = sq ? sq.value : null, sf = sq && document.activeElement === sq;
  side.innerHTML = sidebar(project);

  if (sq2 && sv !== null && key0 === lastRendered) { sq2.value = sv; if (sf) sq2.focus(); }
  const bar = "";
  // The page redraws itself every few seconds while a step runs: keep what the researcher opened or closed.
  const key = `${name}|${view.slug || ""}`;
  const kept = key === lastRendered ? Object.fromEntries([...app.querySelectorAll("details[id]")].map(d => [d.id, d.open])) : {};

  const ctlKey = (el) => el.id || [...el.attributes].filter(a => a.name.startsWith("data-") || a.name === "name").map(a => `${a.name}=${a.value}`).join("|")
    + (el.type === "radio" ? `|v=${el.value}` : "");
  const ctls = key === lastRendered ? new Map([...app.querySelectorAll("input, select, textarea")].filter(el => el.type !== "file").map(el =>
    [ctlKey(el), el.type === "checkbox" || el.type === "radio" ? { checked: el.checked }
      : { value: el.value, sel: el === document.activeElement && "selectionStart" in el ? [el.selectionStart, el.selectionEnd] : null }])) : null;
  // Long boxes (a live log) keep their scroll place; at the bottom, they follow the newest lines.
  const SCROLLERS = "pre.log, .ctx, .tprev, .wrap";
  const scrolls = key === lastRendered ? [...app.querySelectorAll(SCROLLERS)].map(e => ({ top: e.scrollTop, left: e.scrollLeft, end: e.scrollTop + e.clientHeight >= e.scrollHeight - 4 })) : null;
  if (key !== lastRendered) document.getElementById("ctip")?.setAttribute("hidden", "");
  const pageY = window.scrollY;
  const focus = key === lastRendered ? document.activeElement?.id : "";
  const framed = project && !["home", "new"].includes(name);
  // While the platform is slow, a page asked for earlier can finish drawing after the one asked for
  // since: it is dropped, so the page always matches the menu and the address.
  let html;
  try { html = bar + (framed ? stepper(project) : "") + await screens[name]() + (framed ? footer(project) : ""); }
  catch (e) { html = `${bar}<div class="error">${esc(e.message)}</div>`; }
  if (gen !== renderGen) return;
  app.innerHTML = html;
  for (const [id, open] of Object.entries(kept)) { const d = document.getElementById(id); if (d) d.open = open; }
  if (keptAll) { const all = [...app.querySelectorAll("details:not([id])")]; if (all.length === keptAll.length) all.forEach((d, i) => { d.open = keptAll[i]; }); }
  let selection = null;
  if (ctls) [...app.querySelectorAll("input, select, textarea")].forEach(el => {
    const w = ctls.get(ctlKey(el));
    if (!w) return;
    if ("checked" in w) { el.checked = w.checked; return; }
    if (el.value !== w.value) { el.value = w.value; if (el.dataset.setupWho) el.dispatchEvent(new Event("change", { bubbles: true })); }
    if (w.sel) selection = [el, w.sel];
  });
  if (focus) document.getElementById(focus)?.focus();
  if (selection) { try { selection[0].focus(); selection[0].setSelectionRange(...selection[1]); } catch {} }
  if (document.getElementById("f-text")) applyFilters();
  if (scrolls) {
    const boxes = [...app.querySelectorAll(SCROLLERS)];
    if (boxes.length === scrolls.length) boxes.forEach((e, i) => { e.scrollTop = scrolls[i].end && name === "log" ? e.scrollHeight : scrolls[i].top; e.scrollLeft = scrolls[i].left; });
    window.scrollTo(0, pageY);
  }
  const nb = app.querySelector(".next-act .primary");  // one primary action per screen
  if (nb && [...app.querySelectorAll(".primary")].some(x => x !== nb && !x.closest(".stepper"))) nb.closest(".next-act").remove();
  // Arriving in Review, nothing keeps the focus, so Enter approves and → moves on (and no button is pressed by mistake).
  if (name === "review" && key !== lastRendered && document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  if (name === "new" && key !== lastRendered) setTimeout(tfFocus, 0);
  if (key !== lastRendered) {  // opened at a section: Results › Quotes, Results › Cross-analysis

    if (anchor) document.getElementById("sec-" + anchor)?.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);

  // counts as the same page and keeps the sections the researcher opened.
  lastRendered = `${name}|${view.slug || ""}`;

}

// ---------------------------------------------------------------- actions
function readFile(file) {
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => bad(new Error("The file could not be read."));
    r.readAsDataURL(file);
  });
}
let dupes = [];  // files already in the project, waiting for "Add it anyway" or "Skip"
async function upload(list, force = false) {
  const errs = [];
  errorMsg = "";
  for (const f of list) {
    note(`Adding ${f.name}…`);
    try { project = await api(`projects/${view.pid}/interviews`, { filename: f.name, data: await readFile(f), force }); }
    catch (e) { if (e.data?.duplicate) dupes.push({ file: f, msg: e.message }); else errs.push(`${f.name}: ${e.message}`); }
  }
  note("All changes saved");
  await (view.screen === "project" ? load() : go("project"));  // the set-up table is on the overview
  if (errs.length) showError(errs.join("\n"));  // every file that could not be added, not just the last
}

async function act(name) {
  const pid = view.pid, slug = view.slug;
  try {
    if (["approve-check", "approve-final", "codebook-approve"].includes(name)) await saveOpenEdits();
    switch (name) {
      case "home": return go("home");
      case "slides": await openSlides(); return;  // awaited, so a failure shows its message
      case "dash-retry": cache.dash = null; return render();
      case "tf-cancel": store.set(DRAFT_KEY, {}); tfBack = ""; tfError = ""; return go("home");
      case "key-open": keyOpen = true; await render(); document.getElementById("api-key")?.focus(); return;
      case "key-close": keyOpen = false; return render();
      case "key-save": {
        const key = val("api-key").trim();
        if (!key) return showError("Paste your API key in the box first.");
        claude = await api("claude/key", { key }); showBadge();
        document.getElementById("api-key").value = ""; keyOpen = false; note("Key saved · testing it");
        return act("claude-test");  // the key is tried at once: one short question
      }
      case "key-remove": claude = await api("claude/key", { remove: true }); showBadge(); claudeTest = null; note("Key removed"); return render();
      case "claude-recheck": note("Checking…"); await checkClaude(true); note(""); return render();
      case "claude-login": await api("claude/login", {}); loginStarted = true; return render();
      case "claude-test": {  // up to two minutes: the page stays usable meanwhile
        claudeTest = { running: true }; render();
        api("claude/test", {}).then(r => { claudeTest = r; }, e => { claudeTest = { ok: false, message: e.message }; }).then(() => { if (view.screen === "setup") render(); });
        return;
      }
      case "setup-continue": {

        setupReturn = null; return show(to, true);
      }
      case "start-all": {

        for (const sel of document.querySelectorAll("[data-setup-who]")) {
          const sl = sel.dataset.setupWho, iv = project.interviews.find(x => x.slug === sl);
          const labs = (iv.speaker_labels || []).length ? iv.speaker_labels : [{ label: "(no speaker names)" }];

        document.getElementById("add-term").value = ""; await render();

      case "codebook-rerun": await api(`projects/${pid}/codebook/rerun`, {}); note("Running again"); return load();
      case "report": await api(`projects/${pid}/report`, {}); return load();
      case "download": return download();
      case "add-profile": {
        project = await api(`projects/${pid}/profiles`, { role: val("np-role"), org_type: val("np-org"), sector: val("np-sector") });
        editing.delete("prof-new"); note("Profile added"); return render();

        const speakers = {};
        document.querySelectorAll("[data-sp-role]").forEach(sel => { speakers[sel.dataset.spRole] = { role: sel.value }; });
        document.querySelectorAll("[data-sp-prof]").forEach(sel => { (speakers[sel.dataset.spProf] ||= {}).profile = sel.value; });

      }
      case "cross-run": { const later = !!project.running; await api(`projects/${pid}/cross`, {}); cache = {};
        note(later ? "Queued: the cross-analysis runs again once the step running now has finished" : "Running the cross-analysis again"); return load(); }
    }

// A decision accepted as the platform set it: the pre-filled who is who, a transcript check with
// the agent's notes and suggested profile, or an interview approved as it is.
async function quickDecide(slug) {
  const iv = project.interviews.find(x => x.slug === slug), s = ivStatus(project, iv).step;
  const base = `projects/${view.pid}/interviews/${slug}`;
  if (s.id === "speakers") {
    const labels = (iv.speaker_labels || []).length ? iv.speaker_labels : [{ label: "(no speaker names)", words: iv.words }];
    const g = guessSpeakers(project, iv, labels), speakers = {};
    for (const [k, v] of Object.entries(g)) speakers[k] = { role: v.role, profile: v.profile?.id || "" };
    return api(`${base}/set-speakers`, { speakers });
  }
  if (s.id === "confirm-check") {
    const who = Object.values(iv.speakers || {}).find(x => x.role === "interviewee");
    const sugg = project.summaries?.[slug]?.suggested_profile || {};
    return api(`${base}/approve-check`, who && !who.profile ? { new_profile: sugg } : {});
  }
  if (s.id === "approve-final") return api(`${base}/approve-final`, {});
}
// In the Review, a decision made leads straight to the next one; elsewhere, back to its interview.
function afterDecision(slug) {
  if (view.screen === "review") { note("Done · next decision"); show({ screen: "review", pid: view.pid }); return; }
  return slug ? go("interview", { slug }) : go("project");
}
// Removing takes one click; it only really happens after 8 seconds, unless "Undo" is pressed.
const pendingRemoval = new Set();
const pendingPid = {};
window.addEventListener("pagehide", () => {
  pendingRemoval.forEach(slug => fetch(`/api/projects/${pendingPid[slug]}/interviews/${slug}/remove`,
    { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: "{}" }));
});
const pendingTimer = {}, pendingLabel = {};
function showUndo() {  // one line per removal still waiting, each with its own Undo
  const toast = document.getElementById("toast");
  toast.innerHTML = [...pendingRemoval].map(sl => `<div>${esc(pendingLabel[sl])} removed <button type="button" data-undo="${esc(sl)}">Undo</button></div>`).join("");
  toast.hidden = !pendingRemoval.size;
}
document.getElementById("toast").addEventListener("click", (e) => {
  const sl = e.target.closest("[data-undo]")?.dataset.undo; if (!sl) return;
  clearTimeout(pendingTimer[sl]); pendingRemoval.delete(sl); showUndo(); note("Kept"); render();
});
function removeWithUndo(slug) {
  const pid = view.pid, iv = project.interviews.find(x => x.slug === slug);
  pendingRemoval.add(slug); pendingPid[slug] = pid; pendingLabel[slug] = iv ? iv.label : "Interview";
  pendingTimer[slug] = setTimeout(async () => {
    pendingRemoval.delete(slug); showUndo();
    try { await api(`projects/${pid}/interviews/${slug}/remove`, {}); } catch (err) { showError(err.message); }
    if (view.pid === pid) load();
  }, 8000);
  showUndo();
  if (view.screen === "interview" && view.slug === slug) return go("project");
  render();
}
// A file being made stays announced until it arrives (a big zip can take a minute), and a second click
// on the same file does not start it twice.
const preparing = new Set();
function showPreparing() {
  const el = document.getElementById("saved");
  if (preparing.size) el.innerHTML = `${spinner} Preparing ${preparing.size > 1 ? `${preparing.size} files` : "the file"}… it downloads by itself`;
  else if (el.textContent.startsWith("Preparing")) el.textContent = "";
}
async function fetchFile(id, url, fallback) {
  if (preparing.has(id)) return;
  preparing.add(id); showPreparing();
  try {
    const r = await fetch(url);
    if (!r.ok) return showError((await r.json().catch(() => ({}))).error || "The file could not be made.");
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="(.+)"/)?.[1] || fallback;
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r.blob()), download: name });
    a.click(); URL.revokeObjectURL(a.href); note("Downloaded");
  } catch { showError("The file could not be made: the platform did not answer."); }
  finally { preparing.delete(id); showPreparing(); }
}
async function downloadReport(content, slug) {
  return fetchFile(`${content}|${slug}`, `/api/projects/${view.pid}/export?${new URLSearchParams({ content, format: "docx", interview: slug })}`, "report.docx");
}
async function download() {
  const content = document.querySelector("input[name=content]:checked")?.value || "table";
  const format = document.querySelector("input[name=fmt]:checked")?.value || "xlsx";
  store.set("analysis-results-v2", { content, format });
  return fetchFile(`${content}|${format}`, `/api/projects/${view.pid}/export?${new URLSearchParams({ content, format })}`, "results");
}

document.getElementById("home-link").addEventListener("click", () => go("home"));
document.getElementById("menu-toggle").addEventListener("click", (e) => {
  const open = document.body.classList.toggle("menu-open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
document.getElementById("side").addEventListener("click", (e) => { if (e.target.closest("button")) document.body.classList.remove("menu-open"); });
document.addEventListener("keydown", (e) => {
  if (e.target.id === "psearch" && e.key === "Enter" && e.target.value.trim()) go("search", { step: e.target.value.trim() });
  if (e.target.id === "add-term" && e.key === "Enter") { e.preventDefault(); act("add-term"); }
});
document.addEventListener("keydown", (e) => {
  if (view.screen !== "review" || e.altKey || e.ctrlKey || e.metaKey || ["INPUT", "TEXTAREA", "SELECT", "BUTTON", "SUMMARY", "A", "LABEL"].includes(e.target.tagName)
      || e.target.closest(".refine, #side")) return;
  if (e.key === "Enter") { const b = document.querySelector(".row.actions button.primary:not([disabled])"); if (b) { e.preventDefault(); b.click(); } }
  if (e.key === "ArrowRight") {
    const q = queue(project), i = q.findIndex(x => x.key === view.step);
    if (q.length > 1) { e.preventDefault(); show({ screen: "review", pid: view.pid, step: q[(i + 1) % q.length].key }); }
  }
});
const toggle = document.getElementById("theme-toggle");
const showTheme = () => { toggle.textContent = document.documentElement.dataset.theme === "dark" ? "Light" : "Dark"; };
toggle.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("analysis-theme", dark ? "dark" : "light"); } catch {}
  showTheme();
});
showTheme();
document.getElementById("side").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.nav) return go(b.dataset.nav);
  if (b.dataset.act === "back") return back();
  if (b.dataset.open) { view.pid = b.dataset.open; return go("project"); }
  if (b.dataset.new) return go("new");
  if (b.dataset.home) return go("home");
  if (b.dataset.step) return go("step", { slug: b.dataset.slug, step: b.dataset.step });
  if (b.dataset.iv) return go("interview", { slug: b.dataset.iv });
});
let clickBusy = false;
app.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (clickBusy) return;  // a double-click does not start a step twice, nor make two projects
  clickBusy = true;
  try { await onClick(e, b); } finally { clickBusy = false; }
});
// Scrolled so the whole box shows above the sticky action bar at the bottom of decision pages.
function intoView(el) {
  if (!el) return;
  const bar = document.querySelector(".row.actions");
  const barH = bar && getComputedStyle(bar).position === "sticky" ? bar.offsetHeight : 0;
  const r = el.getBoundingClientRect();
  if (r.bottom > window.innerHeight - barH - 8 || r.top < 0) window.scrollBy(0, r.top - Math.max(16, (window.innerHeight - barH - r.height) / 2));
}
async function onClick(e, b) {
  const d = b.dataset;
  errorMsg = "";  // an old error does not outlive the next action
  if (d.edit) { editing.add(d.edit); await render();
    const box = document.querySelector(`#ed-${CSS.escape(d.edit)}, #card-${CSS.escape(d.edit)} textarea, #card-${CSS.escape(d.edit)} input`);
    box?.focus({ preventScroll: true }); intoView(box?.closest(".etext, .icard") || box); return; }
  if (d.cancel) { editing.delete(d.cancel); return render(); }
  if (d.save) return saveCard(d.save);
  if (d.esave) return saveText(d.esave);
  if (d.fremove) {
    const [slug, part, i, on] = d.fremove.split("|");
    try { await api(`projects/${view.pid}/edit-item`, { kind: "codes", slug, part, path: ["codes", +i], remove: on === "1" }); cache = {}; note(on === "1" ? "Removed · you can put it back" : "Put back"); return load(); }
    catch (err) { return showError(err.message); }
  }
  if (d.regen) { regenAsk = d.regen; return render(); }
  if (d.regenCancel) { regenAsk = null; return render(); }
  if (d.trm || d.trmGo) {
    const id = d.trm || d.trmGo;
    if (d.trm && project.codebook.approved) { themeAsk = id; return render(); }
    themeAsk = null;
    try { await api(`projects/${view.pid}/codebook/remove-theme`, { id }); cache = {}; note("Theme removed · you can put it back"); return load(); }
    catch (err) { return showError(err.message); }
  }
  if (d.trmCancel) { themeAsk = null; return render(); }
  if (d.trs) {
    try { await api(`projects/${view.pid}/codebook/restore-theme`, { id: d.trs }); cache = {}; note("Theme put back"); return load(); }
    catch (err) { return showError(err.message); }
  }
  if (d.regenGo) { regenAsk = null; return runAgain(d.regenGo, ""); }
  if (d.refine) { refining = d.refine; await render(); const rf = document.getElementById("rf-text"); rf?.focus({ preventScroll: true }); intoView(rf?.closest(".refine")); return; }
  if (d.offdel !== undefined) return saveMeta(m => { m.consent.off_the_record.splice(+d.offdel, 1); }).then(render);
  if (d.refineCancel) { refining = null; return render(); }
  if (d.refineGo) { const t = val("rf-text").trim(); if (!t) return showError("Write the instruction first."); return runAgain(d.refineGo, t); }
  if (d.jump) { document.getElementById("sec-" + d.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (d.sec) return go("results", { step: d.sec, slug: d.slug || "" });
  if (d.themePick) { themeSel = d.themePick; return render(); }
  if (d.tf) return tfGo(d.tf === "next" ? 1 : -1);
  if (d.tfgo) return tfGo(d.tfgo);
  if (d.from !== undefined) return tfFrom(d.from);
  if (d.act) return act(d.act);
  if (d.open) { view.pid = d.open; return go("project"); }
  if (d.continue) { view.pid = d.continue; return go(d.to); }
  if (d.navGo) return go(d.navGo);
  if (d.pick) return show({ screen: "review", pid: view.pid, step: d.pick });
  if (d.dupSkip !== undefined) { dupes.splice(+d.dupSkip, 1); return render(); }
  if (d.dupAdd !== undefined) { const [x] = dupes.splice(+d.dupAdd, 1); return upload([x.file], true); }
  if (d.step) return go("step", { slug: d.slug, step: d.step });
  if (d.iv) return go("interview", { slug: d.iv });
  if (d.phase) { phaseSel[`${view.pid}/${view.slug}`] = { id: d.phase, at: nowPhase(view.slug) }; return render(); }
  if (d.ivphase) { const [slug, ph] = d.ivphase.split("|"); phaseSel[`${view.pid}/${slug}`] = { id: ph, at: nowPhase(slug) }; return go("interview", { slug }); }
  if (d.prompts) return go("prompts", { slug: d.prompts });
  if (d.dl) return downloadReport(d.dl, d.slug || "");
  if (d.quick) { try { await quickDecide(d.slug); note("Confirmed"); return load(); } catch (err) { return showError(err.message); } }
  if (d.go) return go(d.go, d.slug ? { slug: d.slug } : {});
  if (d.log) return go("log", { slug: d.log });
  if (d.rerun) {
    const busy = project.running;
    try {
      await api(`projects/${view.pid}/interviews/${d.slug}/rerun`, { step: d.rerun });
      note(busy ? "Queued: it runs as soon as the current step has finished" : "Running again");
      return load();
    }
    catch (err) { return showError(err.message); }
  }
  if (d.remove) return removeWithUndo(d.remove);
  if (d.del) return saveMeta(m => { m[d.del].splice(+d.i, 1); }).then(render);
  if (d.delmap) return saveMeta(m => { delete m[d.delmap][d.k]; }).then(render);
}
app.addEventListener("change", async (e) => {
  if (e.target.dataset.setupWho) {  // the set-up table: whoever is not the interviewee listens
    const sl = e.target.dataset.setupWho, cell = document.querySelector(`[data-setup-others="${CSS.escape(sl)}"]`);
    if (cell) cell.textContent = [...e.target.options].map(o => o.value).filter(v => v !== e.target.value).join(", ") || "—";
    return;
  }
  const t = e.target, base = `projects/${view.pid}`;
  if (t.id === "file") return upload([...t.files]);
  if (t.dataset.role !== undefined) return saveMeta(m => { m.speaker_map[t.dataset.role] = t.value; });
  if (t.dataset.theme) return api(`${base}/codebook/edit`, { themes: { [t.dataset.theme]: t.value } }).then(() => { cache.cb = null; note("All changes saved"); }, err => showError(err.message));
  if (t.dataset.group) return api(`${base}/codebook/edit`, { groups: { [t.dataset.group]: t.value } }).then(() => { cache.cb = null; note("All changes saved"); }, err => showError(err.message));
});
app.addEventListener("input", (e) => {  // the new project's answers are kept as you type
  const k = { "tf-name": "name", "tf-question": "question", "tf-subs": "subs", "tf-priors": "priors" }[e.target.id];
  if (k) { setDraft({ [k]: e.target.value }); if (tfError) { tfError = ""; app.querySelector(".tf-err")?.remove(); } }
  if (e.target.dataset.np !== undefined) setDraft({ profiles: draftProfiles() });
});
document.addEventListener("keydown", (e) => {
  if (view.screen !== "new" || e.altKey || e.isComposing) return;
  const t = e.target, at = draft().at || newSteps()[0];
  if (e.key === "Enter") {
    if (t.tagName === "BUTTON") return;  // a focused button does its own thing
    if (t.tagName === "TEXTAREA" && t.id !== "tf-question" && !(e.ctrlKey || e.metaKey)) return;  // a new line in a list
    if (t.id === "tf-question" && e.shiftKey) return;
    if (e.repeat || Date.now() - tfArrived < 300) { e.preventDefault(); return; }  // held down, or pressed twice
    e.preventDefault();
    return at === "review" ? act("create") : tfGo(1);
  }
  if (at === "from" && !["INPUT", "TEXTAREA"].includes(t.tagName) && /^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey) {
    const b = app.querySelectorAll(".tf-choice")[e.key.toUpperCase().charCodeAt(0) - 65];
    if (b) { e.preventDefault(); b.click(); }
  }
});
// The findings filters: hide what does not match, and say how many are left.
function applyFilters() {
  const q = (document.getElementById("f-text")?.value || "").trim().toLowerCase();
  const want = { conf: document.getElementById("f-conf")?.value || "", reader: document.getElementById("f-reader")?.value || "",
                 sq: document.getElementById("f-sq")?.value || "" };
  let shown = 0, total = 0;
  document.querySelectorAll(".finding").forEach(el => {
    total++;
    const ok = (!q || el.dataset.text.includes(q)) && (!want.conf || el.dataset.conf === want.conf)
      && (!want.reader || el.dataset.reader === want.reader) && (!want.sq || el.dataset.sq === want.sq);
    el.hidden = !ok; if (ok) shown++;
  });
  document.querySelectorAll(".reader-card").forEach(c => { c.hidden = !c.querySelector(".finding:not([hidden])"); });
  const n = document.getElementById("f-count");
  if (n) n.textContent = shown === total ? `${total} findings` : `${shown} of ${total} findings shown`;
}
app.addEventListener("input", (e) => { if (e.target.id === "f-text") applyFilters(); });
app.addEventListener("change", (e) => { if (["f-conf", "f-reader", "f-sq"].includes(e.target.id)) applyFilters(); });

document.addEventListener("keydown", (e) => {

const showTip = (el, x, y) => { ctip.textContent = el.dataset.ct; ctip.hidden = false;
  const r = ctip.getBoundingClientRect(); ctip.style.left = `${Math.min(window.innerWidth - r.width - 8, x + 12)}px`; ctip.style.top = `${Math.max(8, y - r.height - 10)}px`; };
app.addEventListener("pointermove", (e) => { const el = e.target.closest("[data-ct]"); if (el) showTip(el, e.clientX, e.clientY); else ctip.hidden = true; });
