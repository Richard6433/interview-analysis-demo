<script>
// The demo's stand-in for the platform's server. It runs in the browser: it answers the page's
// requests (/api/...) the way app.py would, from invented material (window.DEMO), and makes each
// AI step "work" for a few seconds. Nothing is sent anywhere; progress is kept in this browser.
(() => {
  "use strict";
  const D = window.DEMO;
  const KEY = "interview-demo-state-v1", PV = "2.0.0 (demo)";
  const DUR = { check: 2500, read: 5000, codebook: 3500, reread: 3000, latent: 3000, cross: 4000, report: 3500 };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const nowIso = () => new Date().toISOString().slice(0, 19);
  const secs = () => Date.now() / 1000;
  const err = (msg, status = 400, extra = {}) => Object.assign(new Error(msg), { status, extra });

  // ---------------------------------------------------------------- state, kept in this browser
  function freshState() {
    return { projects: [newProject("ai-in-transparency-organisations-demo", "AI in transparency organisations (demo)", D.question, D.subs, [])] };
  }
  function newProject(id, name, question, subs, priors, profiles = []) {
    return { id, name, question, sub_questions: subs, priors, profiles, interviews: [], jobs: {}, running: null, cb: null,
             cross: null, reports: [], shareable: [], reportText: null, data: {}, context_changed_at: 0, created: nowIso(), updated: nowIso() };
  }
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || freshState(); } catch { S = freshState(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const proj = (pid) => { const p = S.projects.find(x => x.id === pid); if (!p) throw err("Not found", 404); p.updated = nowIso(); return p; };
  const ivOf = (p, slug) => { const iv = p.interviews.find(x => x.slug === slug); if (!iv) throw err("Not found", 404); return iv; };
  const sample = (iv) => D.samples[iv.sample];
  const profileText = (pr) => [pr.role, pr.org_type, pr.sector].filter(Boolean).join(", ");

  // ---------------------------------------------------------------- the steps of one interview (as app.steps_for)
  const STEP = [
    ["extract", 1, "Transcript added, text extracted", "program", "the platform (pipeline.py)"],
    ["speakers", "★", "You say who is who: who listens, who speaks, and their profile", "you", "you"],
    ["check", 2, "Transcript check: who is who, misheard words, wrong labels", "agent", "agents.py check (1 agent, claude -p)"],
    ["confirm-check", "★", "You confirm the transcript check", "you", "you"],
    ["list", 3, "Transcript list (dates, word counts)", "program", "guide.py prepare (ta.py manifest)"],
    ["split", 4, "Cut into 4 parts, blank forms, each reader's brief", "program", "guide.py split, then guide.py brief"],
    ["readers", 5, "The five readers (4 parts + the whole interview)", "agent", "agents.py read (5 agents at once, claude -p)"],
    ["checks", 6, "Checks: all five present, well-formed, every quote word for word", "program", "guide.py check (ta.py verify-excerpts)"],
    ["counts", 7, "Count of findings per question", "program", "ta.py coverage"],
    ["themes", 8, "Theme list: findings grouped into themes (shared by the project)", "agent", "agents.py codebook (1 agent, claude -p)"],
    ["approve-themes", "★", "You approve the theme list", "you", "you"],
    ["reread", 9, "Re-read the whole interview against the themes", "agent", "agents.py reread (1 agent, claude -p)"],
    ["latent", 10, "Behind the lines", "agent", "agents.py latent (1 agent, claude -p)"],
    ["approve-final", "★", "You approve the analysis of this interview", "you", "you"],
  ];
  function coverage(p, iv) {
    const counts = {};
    allCodes(p, iv).forEach(c => { counts[c.sub_question] = (counts[c.sub_question] || 0) + 1; });
    return Object.entries(counts).sort().map(([k, n]) => `  ${k.padEnd(6)} ${String(n).padStart(3)}  ${k === "none" ? "Important, but outside the questions" : (p.sub_questions[+k.slice(2) - 1] || "Bears on the research question")}`);
  }
  function stepsFor(p, iv) {
    const s = iv.slug, run = p.running;
    const job = (key, done) => run === key ? "running" : p.jobs[key]?.status === "failed" ? "failed" : done ? "done" : "todo";
    const inCb = !!(p.cb && (p.cb.includes.includes(s) || p.cb.frozen));
    const readRun = run === `${s}:read`;
    const sub = (done) => readRun && !done ? "running" : done ? "done" : "todo";
    const st = {
      extract: iv.status === "extracting" ? "running" : iv.status === "error" ? "failed" : "done",
      speakers: iv.speakers_set ? "done" : iv.status === "ready" ? "you" : "todo",
      check: job(`${s}:check`, iv.checkDone),
      "confirm-check": iv.check_approved ? "done" : iv.checkDone ? "you" : "todo",
      list: sub(iv.readDone), split: sub(iv.readDone), readers: sub(iv.readDone), checks: sub(iv.readDone), counts: sub(iv.readDone),
      themes: run === "codebook" ? "running" : inCb ? "done" : "todo",
      "approve-themes": inCb && p.cb.approved ? "done" : inCb ? "you" : "todo",
      reread: job(`${s}:reread`, iv.rereadDone),
      latent: job(`${s}:latent`, iv.latentDone),
      "approve-final": iv.final_approved ? "done" : iv.rereadDone && iv.latentDone ? "you" : "todo",
    };
    const log = { check: `${s}:check`, list: `${s}:read`, split: `${s}:read`, readers: `${s}:read`, checks: `${s}:read`, counts: `${s}:read`,
                  themes: "codebook", reread: `${s}:reread`, latent: `${s}:latent` };
    return STEP.map(([id, n, title, who, script]) => ({ id, n, title, who, script, about: "", state: st[id], log: log[id],
      lines: id === "counts" && iv.readDone ? coverage(p, iv) : [], detail: id === "extract" ? iv.message || "" : "" }));
  }

  // ---------------------------------------------------------------- what runs next (as app.next_job)
  function nextJob(p) {
    for (const iv of p.interviews) {
      if (iv.status !== "ready" || !iv.speakers_set) continue;
      if (!iv.checkDone) return `${iv.slug}:check`;
      if (iv.check_approved && !iv.readDone) return `${iv.slug}:read`;
    }
    const coded = p.interviews.filter(iv => iv.readDone);
    if (coded.length && !(p.cb && p.cb.frozen) && coded.some(iv => !p.cb || !p.cb.includes.includes(iv.slug)))
      return p.jobs.codebook?.status === "failed" ? null : "codebook";
    if (!p.cb || !p.cb.approved) return null;
    for (const iv of coded) {
      if (!p.cb.includes.includes(iv.slug)) continue;
      if (!iv.rereadDone) return `${iv.slug}:reread`;
      if (!iv.latentDone) return `${iv.slug}:latent`;
    }
    const ok = p.interviews.filter(iv => iv.final_approved).map(iv => iv.slug);
    if (ok.length >= 2 && p.jobs.cross?.status !== "failed") {

      if (!p.cross || ok.some(x => !from.includes(x)) || from.some(x => !p.interviews.some(iv => iv.slug === x))) return "cross";
    }

  }

  }
  function start(p, key) {

    p.jobs[key] = { status: "running", started: nowIso(), log: key.replace(":", "--") + ".log", pipeline_version: PV };

    setTimeout(() => finish(p.id, key), DUR[key.split(":").pop()] || 3000);
  }
  function finish(pid, key) {
    const p = S.projects.find(x => x.id === pid);
    if (!p || p.running !== key) return;
    const [slug, step] = key.includes(":") ? key.split(":") : ["", key];
    const iv = slug ? p.interviews.find(x => x.slug === slug) : null;
    if (slug && !iv) { p.running = null; save(); return; }
    const d = slug ? (p.data[slug] ||= {}) : null;
    switch (step) {
      case "check": d.meta = metaFor(p, iv); iv.checkDone = true; break;
      case "read": d.codes = clone(sample(iv).codes); iv.readDone = true; break;
      case "codebook": buildCodebook(p); break;
      case "reread": d.recode = clone(sample(iv).recode); iv.rereadDone = true; break;
      case "latent": d.latent = clone(sample(iv).latent); iv.latentDone = true; break;
      case "cross": buildCross(p); break;
      case "report": buildReport(p); break;
    }
    Object.assign(p.jobs[key], { status: "done", ended: nowIso(), ended_at: secs() });
    p.running = null;
    save();
    advance(p);
  }
  // A running step does not survive closing the page: it finishes when the page opens again.
  S.projects.forEach(p => { if (p.running) setTimeout(() => finish(p.id, p.running), 1500); });

  function metaFor(p, iv) {
    const m = clone(sample(iv).meta);
    const who = Object.values(iv.speakers || {}).find(x => x.role === "interviewee");
    m.speaker_map = { [D.interviewer]: "interviewer", [sample(iv).interviewee]: who?.profile ? `interviewee: ${profileText(who.profile)}` : "interviewee" };
    return m;
  }
  function allCodes(p, iv) {
    const c = p.data[iv.slug]?.codes || {};
    return Object.values(c).filter(Boolean).flatMap(f => f.codes).filter(x => !x.removed_by_researcher);
  }
  function buildCodebook(p) {
    const coded = p.interviews.filter(iv => iv.readDone);
    const labels = new Set(coded.flatMap(iv => allCodes(p, iv).map(c => c.code)));
    const old = Object.fromEntries((p.cb?.data?.themes || []).map(t => [t.id, t]));
    const oldG = Object.fromEntries((p.cb?.data?.groups || []).map(g => [g.id, g]));
    const themes = D.themes.map(t => ({ id: t.id, name: t.name, definition: t.definition, group: t.group,
      sub_themes: [{ id: `${t.id}.1`, name: t.name, representative_codes: t.codes.filter(c => labels.has(c)) }] }))
      .filter(t => t.sub_themes[0].representative_codes.length)
      .map(t => old[t.id] ? { ...t, name: old[t.id].name, definition: old[t.id].definition, edited_by_researcher: old[t.id].edited_by_researcher } : t);
    const ids = new Set(themes.map(t => t.id));
    const groups = D.groups.map(g => ({ id: g.id, name: oldG[g.id]?.name || g.name, tests: g.tests, themes: D.themes.filter(t => t.group === g.id && ids.has(t.id)).map(t => t.id),
      edited_by_researcher: oldG[g.id]?.edited_by_researcher })).filter(g => g.themes.length);
    p.cb = { includes: coded.map(iv => iv.slug), approved: false, frozen: false,
             data: { themes, groups, unplaced: [], built: nowIso().slice(0, 10), status: "DRAFT" } };
  }
  function buildCross(p) {
    const ok = p.interviews.filter(iv => iv.final_approved);
    const bySample = Object.fromEntries(ok.map(iv => [iv.sample, iv]));
    const cbIds = new Set((p.cb?.data?.themes || []).map(t => t.id));
    const X = D.cross;
    const prof = (iv) => Object.values(iv.speakers || {}).find(x => x.profile)?.profile;
    p.cross = { interviews: ok.map(iv => iv.slug), data: {
      overview: X.overview, built: nowIso().slice(0, 10), interviews: ok.map(iv => iv.slug),
      by_theme: Object.entries(X.by_theme).filter(([t]) => cbIds.has(t)).map(([theme_id, v]) => ({ theme_id, shared: v[0], differences: v[1], by_profile: v[2] })),
      by_profile: ok.map(iv => ({ profile: prof(iv) ? profileText(prof(iv)) : iv.label, what_stands_out: X.by_profile[iv.sample] })),
      patterns: X.patterns.map(pt => ({ pattern: pt.pattern, interviews: pt.samples.filter(s => bySample[s]).map(s => bySample[s].slug),
        evidence: pt.evidence.filter(e => bySample[e.sample]).map(e => ({ slug: bySample[e.sample].slug, text: e.text })) })).filter(pt => pt.evidence.length),
      divergences: X.divergences.filter(v => v.samples.every(s => bySample[s])).map(v => ({ about: v.about, interviews: v.samples.map(s => bySample[s].slug), how_they_differ: v.how })),
      limits: X.limits } };
  }
  function buildReport(p) {
    const ok = p.interviews.filter(iv => iv.final_approved);
    const n = p.reports.length + 1, which = ok.map(iv => iv.n).join("-");
    p.reports.unshift(`interim-findings-v${n}-interviews-${which}.docx`);
    p.shareable.unshift(`interim-findings-v${n}-interviews-${which}-shareable.docx`);
    const themes = {};
    (p.cb?.data?.themes || []).forEach(t => {
      const per = {};
      ok.forEach(iv => { const txt = D.report_theme_text[t.id]?.[iv.sample]; if (txt) per[iv.slug] = txt; });
      themes[t.id] = { what: t.definition, ...per };
    });
    p.reportText = { title: D.report.title, takeaways: D.report.takeaways, limits: D.report.limits, themes, _about: "Written by agents.py (stage 5) from the checked files." };
  }

  // ---------------------------------------------------------------- the project as the page sees it (as app.view)
  function summary(p, iv) {
    const d = p.data[iv.slug] || {}, m = d.meta || {}, codes = allCodes(p, iv), rc = d.recode || {}, lt = d.latent || {};

    return { speakers: Object.keys(m.speaker_map || {}).length, misheard: Object.keys(m.misheard_words || {}).length,
      corrections: (m.speaker_corrections || []).length, names: (m.identifying_terms || []).length, suggested_profile: m.suggested_profile || {},
      findings: codes.length, low: codes.filter(c => c.confidence === "low").length, quotes: iv.readDone ? `${q}/${q}` : "",
      central: (rc.theme_codings || []).filter(c => c.relevance === "primary").length, themes: (rc.theme_codings || []).length,
      fixes: (rc.corrections_to_earlier_coding || []).length, misses: (rc.themes_the_codebook_misses || []).length,
      readings: (lt.readings || []).length, low_readings: (lt.readings || []).filter(r => r.confidence === "low").length,
      silences: (lt.silences || []).length, against: 0 };
  }
  function view(p) {
    const cb = p.cb;
    const out = {
      id: p.id, name: p.name, question: p.question, sub_questions: p.sub_questions, priors: p.priors, profiles: p.profiles,
      interviews: p.interviews.map(iv => ({ ...iv })), jobs: p.jobs, running: p.running, updated: p.updated, created: p.created,
      context_changed_at: p.context_changed_at, codebook_approved_at: 0,
      steps: Object.fromEntries(p.interviews.map(iv => [iv.slug, stepsFor(p, iv)])),
      codebook: { exists: !!cb, approved: !!(cb && cb.approved), frozen: !!(cb && cb.frozen), themes: cb ? cb.data.themes.length : 0, includes: cb ? cb.includes : [] },
      reports: p.reports, shareable_reports: p.shareable, report_job: p.jobs.report || {},
      pipeline_version: PV, model: "simulated in the demo (no AI is called)", provenance: {},
      summaries: Object.fromEntries(p.interviews.map(iv => [iv.slug, summary(p, iv)])),
      cross: { exists: !!p.cross, job: p.jobs.cross || {}, approved: p.interviews.filter(iv => iv.final_approved).map(iv => iv.label), built_from: p.cross ? p.cross.interviews : [] },
    };
    return out;
  }

  // ---------------------------------------------------------------- quotes: every one checked (as app.quotes)
  const FILLERS = new Set(["uh", "um", "umm", "uhm", "er", "erm", "ah", "eh", "hmm", "mm", "mhm"]);
  const words = (t) => t.toLowerCase().replace(/’/g, "'").replace(/[^\w']+/g, " ").split(" ").filter(w => w && !FILLERS.has(w));
  function lineOf(q, lines) {
    const head = q.slice(0, 60);
    let i = lines.findIndex(l => head && l.includes(head));
    if (i >= 0) return i;
    const want = new Set(words(q));
    let best = 0, score = -1;
    lines.forEach((l, k) => { const w = words(l); const hit = w.filter(x => want.has(x)).length / Math.max(1, Math.max(w.length, want.size)); if (hit > score) { score = hit; best = k; } });
    return best;
  }
  function checkQuote(q, text, lines, first) {
    let status;
    if (q && text.includes(q)) status = first ? "partial" : "verified";
    else { const w = words(q).join(" "); status = w && words(text).join(" ").includes(w) ? "partial" : "not_found"; }
    const n = lineOf(q, lines), out = { status, line: n + 1 };
    if (status !== "verified") out.context = lines.slice(Math.max(0, n - 2), n + 3).map((t, k) => ({ n: Math.max(0, n - 2) + k + 1, text: t, hit: Math.max(0, n - 2) + k === n }));
    if (first) out.first_written = first;
    return out;
  }
  function quotes(p) {
    const items = [];
    const label = Object.fromEntries(p.interviews.map(iv => [iv.slug, iv.label]));
    const add = (slug, where, q, edit, first) => {
      const iv = p.interviews.find(x => x.slug === slug);
      if (!q || !iv) return;
      const t = sample(iv).text;
      items.push({ slug, interview: label[slug], where, text: q, edit, ...checkQuote(q, t, t.split("\n"), first) });
    };
    p.interviews.forEach(iv => {
      const d = p.data[iv.slug] || {};
      Object.entries(d.codes || {}).forEach(([part, f]) => (f?.codes || []).forEach((c, i) => {
        if (c.removed_by_researcher) return;
        (c.excerpts || []).forEach((q, n) => add(iv.slug, `Finding: ${c.code}`, q, { kind: "codes", slug: iv.slug, part, path: ["codes", i, "excerpts", n] },
          (c.quote_repairs || []).find(r => r.to === q)?.from));
      }));
      (d.recode?.theme_codings || []).forEach((c, i) => add(iv.slug, `Re-read: ${c.theme_name}`, c.best_quote?.text, { kind: "recode", slug: iv.slug, path: ["theme_codings", i, "best_quote", "text"] }));
      (d.latent?.readings || []).forEach((x, i) => (x.surface_evidence || []).forEach((e, n) => add(iv.slug, `Behind the lines: ${x.reading.slice(0, 80)}`, e.text,
        { kind: "latent", slug: iv.slug, path: ["readings", i, "surface_evidence", n, "text"] })));
    });
    (p.cross?.data?.patterns || []).forEach((x, i) => (x.evidence || []).forEach((e, n) => add(e.slug, `Cross-analysis: ${x.pattern}`, e.text,
      { kind: "cross", slug: "", path: ["patterns", i, "evidence", n, "text"] })));
    const order = { not_found: 0, partial: 1, verified: 2 };
    items.sort((a, b) => order[a.status] - order[b.status] || a.interview.localeCompare(b.interview) || a.line - b.line);
    const count = { not_found: 0, partial: 0, verified: 0 };
    items.forEach(x => { count[x.status]++; });
    return { count, total: items.length, items };
  }

  // ---------------------------------------------------------------- editing what the AI produced (as app.edit_item)
  const EDITABLE = new Set(["code", "description", "interpretation", "name", "definition", "summary", "document_summary", "synthesis", "reading",
    "overview", "shared", "differences", "by_profile", "what_stands_out", "pattern", "how_they_differ", "limits", "text", "excerpts"]);
  function editItem(p, b) {
    const cannot = "This part cannot be edited.";
    const doc = b.kind === "codes" ? p.data[b.slug]?.codes?.[b.part] : b.kind === "codebook" ? p.cb?.data
      : b.kind === "recode" ? p.data[b.slug]?.recode : b.kind === "latent" ? p.data[b.slug]?.latent : b.kind === "cross" ? p.cross?.data : null;
    const path = b.path;
    if (!doc || !Array.isArray(path) || !path.length) throw err(cannot);
    let node = doc, owner = doc, rel = [];
    for (const k of path.slice(0, -1)) {
      node = node?.[k]; rel.push(String(k));
      if (node === undefined || node === null) throw err(cannot);
      if (!Array.isArray(node) && typeof node === "object") { owner = node; rel = []; }
    }
    const last = path[path.length - 1];
    if (typeof node !== "object" || !(last in node)) throw err(cannot);
    const current = node[last];
    rel.push(String(last));
    if (b.remove !== undefined && b.remove !== null) {
      if (b.kind !== "codes" || typeof current !== "object") throw err(cannot);
      current.removed_by_researcher = !!b.remove;
      (current.edited_by_researcher ||= { original: {} }).at = nowIso();
      return;
    }
    const field = typeof last === "string" ? last : String(path[path.length - 2]);
    if (!EDITABLE.has(field) || typeof current !== "string") throw err(cannot);
    const value = String(b.value || "").trim();
    if (!value) throw err("The new text is empty.");
    if (field === "excerpts" || field === "text") {
      const slug = b.kind === "cross" ? owner.slug : b.slug;
      const iv = p.interviews.find(x => x.slug === slug);
      if (!iv || !sample(iv).text.includes(value)) throw err("This quote is not in the transcript word for word. Copy it exactly from the highlighted line.");
    }
    const mark = (owner.edited_by_researcher ||= { original: {} });
    mark.at = nowIso();
    if (!(("@" + rel.join(".")) in mark.original)) mark.original["@" + rel.join(".")] = current;
    node[last] = value;
  }

  // ---------------------------------------------------------------- the requests
  const json = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { "Content-Type": "application/json" } });
  const text = (t) => new Response(t, { status: 200, headers: { "Content-Type": "text/plain; charset=utf-8" } });
  const file = (name, body) => new Response(new Blob([body], { type: "text/plain" }), { status: 200, headers: { "Content-Type": "text/plain", "Content-Disposition": `attachment; filename="${name}"` } });
  const demoFile = (what) => `Interview analysis platform: demo download\n\nIn the real platform, this is ${what}.\nThe demo uses invented interviews and simulated agents, so it gives this note instead.\n`;

  function logFor(p, key) {
    const j = p.jobs[key];
    if (!j) throw err("Nothing was printed for this step yet.", 404);
    const [slug, step] = key.includes(":") ? key.split(":") : ["", key];
    const iv = slug ? p.interviews.find(x => x.slug === slug) : null;
    const note = (p.notes || {})[key];
    const head = `$ uv run agents.py ${step}${iv ? " " + iv.file : ""}${note ? ` --note="${note}"` : ""}\n\n(Demo: a simulated run. No AI was called.` +
      (note ? " Your instruction was given to the agent; in the demo the result is the same pre-written example." : "") + ")\n\n";
    const body = {
      check: "Stage 0 - the transcript check (1 agent)\n  Wrote the notes: speakers, misheard words, wrong labels, names to hide.\n",
      read: iv ? `Building the transcript list (guide.py prepare)\nCutting ${iv.file} into four parts (guide.py split)\n\nStage 1 - the five readers at work at the same time (A, B, C, D, E)\n` +
        Object.entries(p.data[slug]?.codes || {}).map(([r, f]) => `  reader ${r}: ${(f?.codes || []).length} codes`).join("\n") +
        `\n\nThe program's checks (guide.py check)\n  OK - all five reader files present and well-formed.\n  ${summary(p, iv).quotes} verbatim strings verified against the transcript.\n` : "",
      codebook: "Stage 2 - grouping the codes into themes (1 agent)\n  Wrote the theme list.\n",
      reread: "Stage 3 - the re-read against the approved themes (1 agent)\n  Checked by the program.\n",
      latent: "Stage 4 - behind the lines (1 agent)\n  Checked by the program.\n",
      cross: "Stage 6 - the cross-analysis (1 agent)\n  Every quote checked against its transcript.\n",
      report: "Stage 5 - the report's wording (1 agent)\n  Built the report and its shareable copy.\n",
    }[step] || "";
    return head + body + (j.status === "running" ? "\n... running" : "\nDONE.");
  }
  function sent(p, prefix) {
    const pre = D.preamble.replace("{question}", p.question);
    const iv = p.interviews.find(x => prefix.startsWith(x.slug));
    if (prefix.endsWith("--reader") && iv) {
      if (!iv.readDone) return [];
      return sample(iv).parts.map(x => ({ name: x.reader, general: pre, words: String((pre + x.text).split(/\s+/).length),
        specific: `[the general part, shown above]\n\n## Your span (reader ${x.reader}) - code ONLY this\n\n${x.text}` }));
    }
    const what = { check: "Stage 0 — transcript check", reread: "Stage 3 — re-read", latent: "Stage 4 — behind the lines", codebook: "Stage 2 — theme list", cross: "Stage 6 — cross-analysis" };
    const k = Object.keys(what).find(x => prefix.endsWith(x));
    if (!k || !p.jobs[iv ? `${iv.slug}:${k}` : k]) return [];
    const note = (p.notes || {})[iv ? `${iv.slug}:${k}` : k];
    return [{ name: prefix, general: pre, words: "about 3,000", specific: `[the general part, shown above]\n\n## ${what[k]}\n\n${(D.stages.find(s => s.heading === what[k]) || {}).text || ""}` +
      (note ? `\n\n## The researcher's instruction for this run\n${note}` : "") + "\n\n(Demo: the transcript and notes would follow here.)" }];
  }
  function search(p, q) {
    const w = q.toLowerCase().split(/\s+/).filter(Boolean);
    const match = (...t) => { const b = t.join(" ").toLowerCase(); return w.length && w.every(x => b.includes(x)); };
    const hits = [];
    p.interviews.forEach(iv => allCodes(p, iv).forEach(c => {
      if (match(c.code, c.description, ...(c.excerpts || []))) hits.push({ kind: "Finding", where: iv.label, slug: iv.slug, go: "codes", title: c.code, text: c.description, quote: (c.excerpts || [])[0] || "" });
    }));
    (p.cb?.data?.themes || []).forEach(t => { if (match(t.name, t.definition)) hits.push({ kind: "Theme", where: "Theme list", slug: "", go: "codebook", title: t.name, text: t.definition, quote: "" }); });
    return hits;
  }

  function get(path, qs) {
    if (path.length === 1) return json(S.projects.map(p => ({ id: p.id, name: p.name, question: p.question, updated: p.updated, interviews: p.interviews.length })));
    const p = proj(path[1]);
    if (path.length === 2) return json(view(p));
    const [, , what, kind, a, b] = path;
    if (what === "log") return text(logFor(p, kind));
    if (what === "quotes") return json(quotes(p));
    if (what === "search") return json(search(p, qs.get("q") || ""));
    if (what === "export") {
      const c = qs.get("content");
      const name = { all: "everything-demo.txt", interview: "interview-report-demo.txt", "interview-shareable": "interview-report-shareable-demo.txt",
                     cross: "cross-analysis-demo.txt", "cross-shareable": "cross-analysis-shareable-demo.txt" }[c] || `findings-table-demo.${qs.get("format") === "html" ? "html" : "txt"}`;
      return file(name, demoFile(c === "all" ? "a zip file with every report and table, full and shareable" : c && c.startsWith("table") ? "a table of every finding and theme (Excel, CSV or web page)" : "a Word report"));
    }
    if (what !== "file") throw err("Not found", 404);
    const iv = a ? p.interviews.find(x => x.slug === a) : null, d = a ? p.data[a] || {} : {};
    switch (kind) {
      case "meta": return json(d.meta || {});
      case "codes": return json(Object.fromEntries("ABCDE".split("").map(c => [c, d.codes?.[c] || null])));
      case "codebook": return json(p.cb ? { ...p.cb.data, includes: p.cb.includes, frozen: p.cb.frozen } : {});
      case "cross": return json(p.cross?.data || {});
      case "final": return json({ recode: d.recode || null, latent: d.latent || null });
      case "transcript": if (!iv) throw err("Not found", 404); return text(sample(iv).text);
      case "report-text": return json(p.reportText || {});
      case "general": return json({ file: "prompts/v1.md (demo excerpt)", preamble: D.preamble.replace("{question}", p.question), stages: D.stages });
      case "split": return json({ parts: iv && iv.readDone ? sample(iv).parts : [] });
      case "sent": return json(sent(p, a || ""));
      case "report": return file(String(b || "report.docx").replace(/\.docx$/, "-demo.txt"), demoFile("the findings report, in Word"));
    }
    throw err("Not found", 404);
  }

  // The researcher removes a theme (its findings become "not placed"), or puts it back; the list then needs approving again.
  function themeOutOrBack(p, tid, out) {
    if (p.running) throw err("A step is running. Change the theme list once it has finished.");
    if (!p.cb) throw err("Not found", 404);
    if (p.cb.frozen) throw err("The theme list is frozen: it can no longer change.");
    const cb = p.cb.data, aside = (cb.removed_by_researcher ||= []);
    if (out) {
      const t = cb.themes.find(x => x.id === tid); if (!t) throw err("Not found", 404);
      const group = (cb.groups || []).find(g => g.themes.includes(tid));
      cb.themes = cb.themes.filter(x => x !== t);
      if (group) group.themes = group.themes.filter(x => x !== tid);
      const emptied = group ? { ...group, themes: [] } : null;
      cb.groups = (cb.groups || []).filter(g => g.themes.length);
      (cb.unplaced ||= []).push(...(t.sub_themes || []).flatMap(s => s.representative_codes || [])
        .map(c => ({ code: c, reason: `Its theme was removed by you: ${t.name}`, from_theme: tid })));
      aside.push({ theme: t, group: group ? group.id : "", group_entry: emptied, at: nowIso() });
    } else {
      const entry = aside.find(r => r.theme.id === tid); if (!entry) throw err("Not found", 404);
      cb.removed_by_researcher = aside.filter(r => r !== entry);
      cb.themes.push(entry.theme);
      const group = (cb.groups || []).find(g => g.id === entry.group);
      if (group) group.themes.push(tid); else if (entry.group_entry) (cb.groups ||= []).push({ ...entry.group_entry, themes: [tid] });
      cb.unplaced = (cb.unplaced || []).filter(u => u.from_theme !== tid);
    }
    p.cb.approved = false;
  }
  function addInterview(p, body) {
    const used = new Set(p.interviews.map(iv => iv.sample));
    const next = Object.keys(D.samples).find(k => !used.has(k));
    const dup = p.interviews.find(iv => iv.original === body.filename);
    if (dup && !body.force) throw err(`${body.filename} is already in this project, as ${dup.label}.`, 409, { duplicate: true });
    if (!next) throw err("The demo has three invented interviews, and all three are already in this project. Remove one to add it again.");
    const s = D.samples[next], n = Math.max(p.next_n || 0, Math.max(0, ...p.interviews.map(iv => iv.n)) + 1);
    p.next_n = n + 1;  // never reuse a removed number
    const slug = `int${String(n).padStart(2, "0")}-${s.date}`;
    const iv = { n, slug, label: `Interview ${n}`, original: body.filename && !body.filename.startsWith("sample:") ? `${body.filename} (demo: replaced by ${s.original})` : s.original,
      file: `INT${String(n).padStart(2, "0")}-${s.date}.txt`, words: s.words, status: "extracting", message: "", sample: next,
      speaker_labels: s.speaker_labels, speakers: {}, speakers_set: false, check_approved: false, final_approved: false };
    p.interviews.push(iv);
    setTimeout(() => { iv.status = "ready"; save(); }, 1200);
  }
  function settle(p, iv, b) {
    const who = Object.values(iv.speakers).find(x => x.role === "interviewee");
    if (!who || who.profile) return;
    let pr = null;
    if (b.new_profile && String(b.new_profile.role || "").trim()) {
      pr = { id: `P${p.profiles.length + 1}`, role: b.new_profile.role, org_type: b.new_profile.org_type || "", sector: b.new_profile.sector || "" };
      p.profiles.push(pr);
    } else if (b.profile_id) pr = p.profiles.find(x => x.id === b.profile_id);
    if (pr) { who.profile = clone(pr); const m = p.data[iv.slug]?.meta; if (m) m.speaker_map[who.label] = `interviewee: ${profileText(pr)}`; }
  }

  function post(path, b) {
    if (path.length === 1) {  // a new project
      const name = String(b.name || "").trim(), question = String(b.question || "").trim();
      if (!name || !question) throw err("A project needs a name and a research question.");
      const lines = (v) => String(v || "").split("\n").map(x => x.trim()).filter(Boolean);
      let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "project";
      while (S.projects.some(p => p.id === id)) id += "-2";
      const profs = (b.profiles || []).filter(x => String(x.role || "").trim()).map((x, i) => ({ id: `P${i + 1}`, role: x.role, org_type: x.org_type || "", sector: x.sector || "" }));
      const p = newProject(id, name, question, lines(b.sub_questions), lines(b.priors), profs);
      S.projects.unshift(p); save();
      return json(view(p));
    }
    const p = proj(path[1]), what = path[2];
    switch (what) {

          case "approve-check": settle(p, iv, b); iv.check_approved = true; break;
          case "edit-check": Object.assign((p.data[iv.slug] ||= {}).meta ||= {}, b); break;
          case "approve-final": iv.final_approved = true; break;
          case "reopen-final": iv.final_approved = false; break;
          case "rerun": {
            const step = b.step;
            if (b.note && p.running) throw err("Another step is running. Refine this one once it has finished.");
            if (b.note) (p.notes ||= {})[`${iv.slug}:${step}`] = b.note; else delete (p.notes || {})[`${iv.slug}:${step}`];
            if (step === "check") Object.assign(iv, { checkDone: false, check_approved: false });
            if (step === "read") { iv.readDone = false; if (p.cb && !p.cb.frozen) p.cb.includes = p.cb.includes.filter(x => x !== iv.slug); }
            if (step === "reread") iv.rereadDone = false;
            if (step === "latent") iv.latentDone = false;
            iv.final_approved = false; delete p.jobs[`${iv.slug}:${step}`];
            if (!p.running) start(p, `${iv.slug}:${step}`);
            break;
          }
          case "remove":
            p.interviews = p.interviews.filter(x => x !== iv); delete p.data[iv.slug];
            Object.keys(p.jobs).filter(k => k.startsWith(iv.slug + ":")).forEach(k => delete p.jobs[k]);
            if (p.cb) p.cb.includes = p.cb.includes.filter(x => x !== iv.slug);
            break;
          default: throw err("Not found", 404);
        }
        break;
      }
      case "codebook": {
        const action = path[3];
        if (action === "edit") {
          (p.cb?.data.themes || []).forEach(t => { if (b.themes && t.id in b.themes) t.name = b.themes[t.id] || t.name; });
          (p.cb?.data.groups || []).forEach(g => { if (b.groups && g.id in b.groups) g.name = b.groups[g.id] || g.name; });
        } else if (action === "approve") { p.cb.approved = true; p.cb.frozen = !!b.freeze; }
        else if (action === "rerun") {
          if (b.note) (p.notes ||= {}).codebook = b.note;
          delete p.jobs.codebook; if (!p.running) start(p, "codebook"); save(); return json(view(p));
        }
        else if (action === "remove-theme" || action === "restore-theme") themeOutOrBack(p, b.id, action === "remove-theme");
        break;
      }
      case "report": if (!p.running) start(p, "report"); break;
      case "cross": {
        if (p.interviews.filter(iv => iv.final_approved).length < 2) throw err("The cross-analysis needs at least two approved interviews.");
        delete p.jobs.cross; if (!p.running) start(p, "cross"); break;
      }
      case "profiles": {
        const f = { role: String(b.role || "").trim(), org_type: String(b.org_type || "").trim(), sector: String(b.sector || "").trim() };
        if (!f.role) throw err("A profile needs at least a role or position.");
        if (b.id) {
          const pr = p.profiles.find(x => x.id === b.id); if (!pr) throw err("Not found", 404);
          Object.assign(pr, f);
          p.interviews.forEach(iv => Object.values(iv.speakers || {}).forEach(sp => { if (sp.profile?.id === b.id) sp.profile = clone(pr); }));
        } else p.profiles.push({ id: `P${p.profiles.length + 1}`, ...f });
        break;
      }
      case "edit": {
        const lines = (k) => k in b ? (Array.isArray(b[k]) ? b[k] : String(b[k]).split("\n")).map(x => String(x).trim()).filter(Boolean) : p[k];
        if ("question" in b && !String(b.question).trim()) throw err("The research question cannot be empty.");
        const q = String(b.question ?? p.question).trim() || p.question, subs = lines("sub_questions"), priors = lines("priors");
        if (JSON.stringify(subs) !== JSON.stringify(p.sub_questions) && p.running) throw err("A step is running. Change the sub-questions once it has finished.");
        if (q !== p.question || JSON.stringify(subs) !== JSON.stringify(p.sub_questions) || JSON.stringify(priors) !== JSON.stringify(p.priors)) p.context_changed_at = secs();
        Object.assign(p, { name: String(b.name ?? p.name).trim() || p.name, question: q, sub_questions: subs, priors });
        break;
      }
      case "edit-item": editItem(p, b); break;
      case "delete": {
        if (b.confirm !== p.name) throw err("Deleting a project must be confirmed.");
        if (p.running) throw err("A step of this project is running. Wait until it has finished.");
        S.projects = S.projects.filter(x => x !== p); save();
        return json({ deleted: p.id });
      }
      default: throw err("Not found", 404);
    }
    advance(p);
    save();
    return json(view(p));
  }

  // ---------------------------------------------------------------- the page's requests go here, not to a server
  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const u = new URL(typeof input === "string" ? input : input.url, location.href);
    const i = u.pathname.indexOf("/api/");
    if (i < 0) return realFetch(input, init);
    const path = u.pathname.slice(i + 5).split("/").filter(Boolean).map(decodeURIComponent);
    try {
      await new Promise(r => setTimeout(r, 60));  // a server's small delay
      return (init.method || "GET") === "GET" ? get(path, u.searchParams) : post(path, init.body ? JSON.parse(init.body) : {});
    } catch (e) {
      return json({ error: e.message || "Something went wrong.", ...(e.extra || {}) }, e.status || 400);
    }
  };
  // Report links (<a href="/api/...">) download the demo note instead of leaving the page.
  document.addEventListener("click", async (e) => {
    const a = e.target.closest && e.target.closest('a[href*="/api/"]');
    if (!a) return;
    e.preventDefault();
    const r = await window.fetch(a.getAttribute("href"));
    const name = (r.headers.get("Content-Disposition") || "").match(/filename="(.+)"/)?.[1] || "demo.txt";
    const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r.blob()), download: name });
    link.click(); URL.revokeObjectURL(link.href);
  }, true);

  // The demo opens on its project the first time.
  try { if (!localStorage.getItem("analysis-view-v2") && !location.hash) location.hash = "#project/" + S.projects[0]?.id; } catch {}

// Every AI result can be run again as it is (Regenerate) or with an instruction of yours (Refine).
function aiActions(key, label) {
  if (refining === key) return `<div class="refine"><label class="field" for="rf-text">What should the AI do differently for ${esc(label)}?
      ${tip("Your instruction is added at the end of the agent's instructions for this one run, and kept with its prompt under Technical details.")}</label>
    <textarea id="rf-text" rows="2" placeholder="e.g. Pay more attention to how staff describe their doubts"></textarea>
    <div class="row"><button class="small" data-refine-cancel="1">Cancel</button><button class="small primary" data-refine-go="${esc(key)}">Run it with this instruction</button></div></div>`;
  if (regenAsk === key) return `<div class="refine"><b>Run ${esc(label)} again?</b> It takes a few minutes. The current version is kept in backups;
      what it produces must then be approved again.
    <div class="row" style="margin-top:6px"><button class="small" data-regen-cancel="1">Cancel</button><button class="small primary" data-regen-go="${esc(key)}">Yes, run it again</button></div></div>`;
  // While an agent works, nothing else can run: say so instead of showing buttons that do nothing.
  if (project.running) return `<span class="ai-wait">${spinner} Regenerate / Refine: available once the step running now has finished</span>`;
  return `<span class="row ai-act"><button class="small" data-regen="${esc(key)}" title="Run ${esc(label)} again; the current version is kept in backups">↻ Regenerate</button>
    <button class="small" data-refine="${esc(key)}" title="Run ${esc(label)} again with an instruction of yours">✦ Refine…</button></span>`;
}
async function runAgain(key, instruction) {
  const [step, slug] = key.split(":");
  try {
    if (step === "codebook") await api(`projects/${view.pid}/codebook/rerun`, { note: instruction });
    else if (step === "cross") await api(`projects/${view.pid}/cross`, { note: instruction });
    else await api(`projects/${view.pid}/interviews/${slug}/rerun`, { step, note: instruction, fresh: true });
    refining = null; cache = {};
    note(instruction ? "Running again with your instruction" : "Running again · the earlier version is kept");
    return load();
  } catch (e) { return showError(e.message); }
}
async function saveCard(id) {

function stepCard(iv, s) {

  const todo = s.state === "you" ? G.todo
    : s.state === "failed" ? stopText(s, G)
    : s.state === "running" ? "Nothing: it is running. You can leave this page."
    : s.state === "todo" ? "Nothing yet: it starts once the steps before it are done." : "Nothing: it is done.";
  const b = [];
  const open = OPEN[s.id];
  if (s.state === "you" && open) b.push(`<button class="primary" data-go="${open[0]}" data-slug="${esc(iv.slug)}">${open[1]}</button>`);
  if (s.state === "you" && (s.id === "speakers" || s.id === "confirm-check"))
    b.push(`<button data-quick="${s.id === "speakers" ? "speakers" : "check"}" data-slug="${esc(iv.slug)}">Confirm as suggested</button>`);
  if (s.state === "failed" && RERUN[s.id]) b.push(`<button class="primary" data-rerun="${RERUN[s.id]}" data-slug="${esc(iv.slug)}">Run again</button>`);

  return `<article class="stepcard ${s.state}"><header><span class="dot ${s.state}" aria-hidden="true">${ICON[s.state]}</span><h3>${esc(G.title)}</h3>

// Why a step stopped, in words: another interview's file, a misquote, or something else.
function stopText(s, G) {
  const r = s.reason || {};
  const found = (r.problems || []).length ? `<span class="found">The check found: ${r.problems.map(esc).join(" · ")}</span>`
    : r.stopped ? `<span class="found">${esc(r.stopped)}</span>` : "";

    return `This interview's work was fine: the check stopped on a problem in ${esc(r.others.join(" and "))}. Open ${r.others.length > 1 ? "them" : "it"} and fix that first, then click “Run again” here.${found}`;

  return `See why it stopped, then click “Run again”. If it stops the same way twice, the fix is needed elsewhere first.${found}`;
}

  step(stepId) {

  async split() {

    return `${errorBox()}<div class="card"><h2>${esc(iv.label)}: how the transcript was split</h2>

  speakers() {

          what: `Every agent reads it first. A change makes a new version of the agents' instructions. ${tip("Steps already done keep the version they used; the cross-analysis is framed by the current one.")}`,
          body: `<p class="value">${esc(p.question)}</p>`,
          editor: `<label class="field" for="ed-question">Research question</label><textarea id="ed-question" rows="3">${esc(p.question)}</textarea>` })}
        ${icard({ id: "subs", title: "Sub-questions", src: "you", count: p.sub_questions.length,
          what: `Each finding is tagged with the sub-question it bears on. ${tip("So you can see which questions the interviews answer. Findings already made keep their tags; re-read an interview to tag it with new questions.")}`,
          body: lines(p.sub_questions.map((x, i) => `SQ${i + 1}. ${x}`), "None: findings are tagged with the research question only.", "bare"),
          editor: `<label class="field" for="ed-subs">One sub-question per line</label><textarea id="ed-subs" rows="6">${esc(p.sub_questions.join("\n"))}</textarea>
            <p class="muted">Interviews already read keep their tags; re-read one to apply the new questions.</p>` })}
        ${icard({ id: "priors", title: "Earlier conclusions to test", src: "you", count: p.priors.length,
          what: `Every interview is checked against them: supported, complicated or contradicted. ${tip("Conclusions from earlier work, for example your desk research.")}`,
          body: lines(p.priors, "None given."),
          editor: `<label class="field" for="ed-priors">One conclusion per line</label><textarea id="ed-priors" rows="5">${esc(p.priors.join("\n"))}</textarea>` })}
        ${icard({ id: "profiles", title: "Interviewee profiles", src: "you", count: (p.profiles || []).length,
          what: `Role, type of organisation, sector; never a name. ${tip("The cross-analysis compares interviews by profile.")}`,
          body: (profRows || '<p class="muted">None yet: the transcript check suggests one for each interviewee.</p>')
            + (editing.has("prof-new") ? `<div class="item">${profileForm()}<div class="row"><button class="small" data-cancel="prof-new">Cancel</button></div></div>`
              : `<div class="row" style="margin-top:8px"><button class="small" data-edit="prof-new">+ Add a profile</button></div>`) })}
      </div>
      <details class="card" id="pipeline"><summary>How each interview is processed: the ${STEP_ORDER.length} steps, who does each, and what it produces</summary>
        ${PHASES.map((ph, i) => `<h4>${i + 1}. ${ph.name}</h4>${ph.steps.map(id => { const G = STEP_GUIDE[id], who = KIND_OF[id] ? "you" : ({ extract: "program", list: "program", split: "program", checks: "program", counts: "program" }[id] || "agent");
          return `<div class="pipe"><span class="who">${WHO_ICON[who]} ${WHO_KIND[who]}</span><div><b>${esc(G.title)}</b><div class="muted">${G.what}</div><div class="muted"><b>Produces:</b> ${G.produces}</div></div></div>`; }).join("")}`).join("")}</details>
      <details class="card" id="settings"><summary>Project settings: rename or delete the project</summary>
        <div style="margin-top:10px">${icard({ id: "name", title: "Project name", src: "you", what: "Shown in the menu and on the reports.",
          body: `<p class="value">${esc(p.name)}</p>`, editor: `<label class="field" for="ed-name">Project name</label><input type="text" id="ed-name" value="${esc(p.name)}">` })}</div>
      <div class="icard" style="border-color:var(--bad);margin-top:12px">${confirmDelete
        ? `<h3>Delete “${esc(p.name)}” permanently?</h3>
           <p>This removes the project from this computer: its ${p.interviews.length} transcript(s), every finding, the theme list
             and every report. It cannot be undone. Download anything you want to keep first.</p>
           <div class="row"><button data-act="delete-cancel">Cancel</button>
             <button data-act="delete-yes" style="background:var(--bad);border-color:var(--bad);color:var(--surface)">Yes, delete it permanently</button></div>`
        : `<div class="spread"><div><h3>Delete this project</h3><div class="muted">Removes it and all its files from this computer.</div></div>
           <button data-act="delete-ask" ${p.running ? "disabled title=\"Wait until the running step has finished\"" : ""}>Delete this project</button></div>`}</div></details>`;
  },

  async check() {
    const iv = project.interviews.find(x => x.slug === view.slug);
    if (!iv) return GONE;
    const m = cache.meta ??= await api(`projects/${view.pid}/file/meta/${view.slug}`);
    const done = iv.check_approved;
    const list = (key, title, hint) => `<h4>${title}</h4>${hint ? `<p class="muted">${hint}</p>` : ""}
      ${(m[key] || []).length ? `<div class="pill-list">${m[key].map((x, i) => `<span>${esc(x)}${done ? "" : `<button data-del="${key}" data-i="${i}" aria-label="Remove">✕</button>`}</span>`).join("")}</div>` : '<p class="muted">None found.</p>'}`;
    const who = Object.values(iv.speakers || {}).find(x => x.role === "interviewee");
    const sugg = project.summaries?.[iv.slug]?.suggested_profile || {};
    const needProfile = !done && who && !who.profile;
    const look = [["speaker_corrections", "Lines with the wrong speaker label"], ["meaning_critical_readings", "Sentences that may say the opposite of what was meant"],
                  ["interviewer_talking", "Where an interviewer does the talking"]].filter(([k]) => (m[k] || []).length);
    return `${errorBox()}${view.screen === "review" ? "" : `<h2 class="pg">${esc(iv.label)} · transcript check</h2>`}
      ${done ? banner("Confirmed. The analysis carries on by itself.", "Status") : ""}
      <div class="card attn"><div class="spread"><h3 style="margin:0">${done ? "What was flagged" : "Worth a look before you confirm"}</h3>${done ? "" : aiActions(`check:${iv.slug}`, "the transcript check")}</div>
        ${look.length ? look.map(([k, t]) => `<h4>${t}</h4>${m[k].map((x, i) => `<div class="item spread" style="flex-wrap:nowrap"><span>${esc(x)}</span>${done ? "" : `<button class="small" data-del="${k}" data-i="${i}">✕ Remove this note</button>`}</div>`).join("")}`).join("")
          : '<p class="muted">Nothing unusual: no line under the wrong speaker, no sentence that may say the opposite.</p>'}
        ${needProfile ? `<h4>The interviewee's profile ${kindTag("def")}</h4>
          <p class="muted">Suggested by the agent from what ${esc(who.label)} says about themselves. Keep it, edit it, or pick an existing profile.</p>
          <label class="field" for="cp-pick">Profile</label><select id="cp-pick">
            <option value="new" selected>The suggested profile (below)</option>
            ${(project.profiles || []).map(pr => `<option value="${esc(pr.id)}">${esc(profileText(pr))}</option>`).join("")}</select>
          <div class="grid" style="margin-top:8px">${[["role", "Role or position"], ["org_type", "Type of organisation"], ["sector", "Sector"]].map(([k, t]) =>
            `<div><label class="field" for="cp-${k}">${t}</label><input type="text" id="cp-${k}" value="${esc(sugg[k] || "")}"></div>`).join("")}</div>`
          : who && who.profile ? `<p class="muted">Interviewee: ${esc(profileText(who.profile))}</p>` : ""}
      </div>
      <details class="more" id="check-other-notes"><summary>The agent's other notes: who is who, misheard words, weak evidence, names to hide</summary>
      <div class="card"><h2>${esc(iv.label)}: transcript check</h2>
        <p class="muted">Done by an agent ${tip("Every later agent is given these notes. The notes are a default: remove anything wrong. Confirming them is your decision.")}</p>
        <h4>Who is who</h4><div class="wrap"><table><tr><th>Speaker label</th><th>Role</th></tr>
          ${Object.entries(m.speaker_map || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td><input type="text" data-role="${esc(k)}" value="${esc(v)}" ${done ? "disabled" : ""} aria-label="Role of ${esc(k)}"></td></tr>`).join("")}</table></div>
        <h4>Misheard words</h4>${Object.keys(m.misheard_words || {}).length ? `<div class="pill-list">${Object.entries(m.misheard_words).map(([k, v]) => `<span>${esc(k)} → ${esc(v)}${done ? "" : `<button data-delmap="misheard_words" data-k="${esc(k)}" aria-label="Remove">✕</button>`}</span>`).join("")}</div>` : '<p class="muted">None found.</p>'}
        ${list("leading_questions_weak_evidence", "Agreement with an interviewer's idea (weak evidence)")}
        ${list("identifying_terms", "Names that could identify someone", "Removed from every shareable result.")}
      </div></details>
      ${done ? "" : `<div class="row actions"><span class="rule">Remove any wrong note, settle the profile if asked, then confirm.</span>
        <button class="primary" data-act="approve-check">Confirm and continue</button></div>`}`;
  },

  async codes() {
    const iv = project.interviews.find(x => x.slug === view.slug);
    if (!iv) return GONE;
    const forms = cache.codes ??= await api(`projects/${view.pid}/file/codes/${view.slug}`);
    return `${errorBox()}<div class="card"><div class="spread"><h2 style="margin:0">${esc(iv.label)}: what the five readers found</h2><span class="row">${srcTag("ai")}${aiActions(`read:${iv.slug}`, "the five readers")}</span></div>
      <p class="muted">Every quote checked word for word. Click ✎ to reword a finding, or Remove one that is wrong: the AI's original is kept. ${tip("The program found each quote in the transcript. Each finding also says how sure its reader is (high, medium, low) and why.")}</p>
      ${(() => { const all = Object.values(forms).filter(Boolean).flatMap(f => f.codes);
        const n = (lv) => all.filter(c => c.confidence === lv).length;
        return all.some(c => c.confidence) ? `<div class="row"><span class="tag ok">high: ${n("high")}</span><span class="tag plain">medium: ${n("medium")}</span>
          <span class="tag grey">low: ${n("low")}</span>${all.length - n("high") - n("medium") - n("low") ? `<span class="muted">${all.length - n("high") - n("medium") - n("low")} without a level (coded before confidence was asked)</span>` : ""}</div>` : ""; })()}</div>
      ${(() => { const all = Object.values(forms).filter(Boolean).flatMap(f => f.codes);
        const sqs = [...new Set(all.map(c => c.sub_question).filter(Boolean))].sort();
        const sel = (id, label, opts) => `<label class="muted">${label} <select id="${id}">${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("")}</select></label>`;
        return `<div class="card filters"><div class="row">
          <input type="text" id="f-text" placeholder="Search the findings and quotes" style="flex:1;min-width:200px" aria-label="Search">
          ${sel("f-conf", "Confidence", [["", "all"], ["high", "high"], ["medium", "medium"], ["low", "low"]])}
          ${sel("f-reader", "Reader", [["", "all"], ...["A", "B", "C", "D", "E"].map(x => [x, x])])}
          ${sqs.length > 1 ? sel("f-sq", "Question", [["", "all"], ...sqs.map(x => [x, x])]) : ""}</div>
          <div class="muted" id="f-count" style="margin-top:6px">${all.length} findings</div></div>`; })()}
      ${Object.entries(forms).filter(([, f]) => f).map(([r, f]) => `<div class="card reader-card"><h3>${r === "E" ? "Reader E: the whole interview" : `Reader ${r}: part ${r}`} <span class="muted">· ${f.codes.length} findings · ${esc(f.chunk.span || "")}</span></h3>
        ${f.codes.map((c, i) => `<div class="item finding ${c.removed_by_researcher ? "removed" : ""}" data-conf="${esc(c.confidence || "")}" data-reader="${r}" data-sq="${esc(c.sub_question || "")}"
            data-text="${esc([c.code, c.description, ...(c.excerpts || [])].join(" ").toLowerCase())}"><div class="spread"><div><b>${etext(`c-${r}-${i}-code`, c.code, { kind: "codes", slug: view.slug, part: r, path: ["codes", i, "code"] }, origOf(c, "code"), false)}</b> <span class="muted">· ${esc(c.valence)} · ${esc(c.sub_question)}${String(c.evidence_strength || "").startsWith("weak") ? " · weak evidence" : ""}</span></div>
          <span class="row">${c.confidence ? `<span class="tag ${CONF[c.confidence] || "grey"}">confidence: ${esc(c.confidence)}</span>` : ""}
          <button class="small" data-fremove="${esc(view.slug)}|${r}|${i}|${c.removed_by_researcher ? 0 : 1}">${c.removed_by_researcher ? "Put back" : "Remove"}</button></span></div>
          ${c.removed_by_researcher ? '<div class="muted"><b>Removed by you:</b> left out of the results now, and of the theme list the next time it is built.</div>' : ""}
          ${c.confidence_reason ? `<div class="muted"><b>Why:</b> ${esc(c.confidence_reason)}</div>` : ""}
          <div>${etext(`c-${r}-${i}-d`, c.description, { kind: "codes", slug: view.slug, part: r, path: ["codes", i, "description"] }, origOf(c, "description"))}</div>${(c.excerpts || []).map(x => `<blockquote>“${esc(x)}” <span class="srcl">${esc(c.speaker)}, ${esc(c.timestamp)}</span></blockquote>`).join("")}
          ${c.interpretation ? `<div class="muted"><b>Interpretation:</b> ${etext(`c-${r}-${i}-i`, c.interpretation, { kind: "codes", slug: view.slug, part: r, path: ["codes", i, "interpretation"] }, origOf(c, "interpretation"))}</div>` : ""}</div>`).join("")}</div>`).join("")}
      <div class="row"><button data-act="back">← Back</button></div>`;
  },

  async codebook() {
    const cb = cache.cb ??= await api(`projects/${view.pid}/file/codebook`);
    const st = project.codebook, done = st.approved;
    const byId = Object.fromEntries((cb.themes || []).map(t => [t.id, t]));
    const idx = Object.fromEntries((cb.themes || []).map((t, i) => [t.id, i]));
    const grouped = new Set((cb.groups || []).flatMap(g => g.themes));
    const theme = (t) => `<div class="item"><div class="row"><span class="muted">${esc(t.id)}</span>
        <b>${etext(`t-${t.id}-n`, t.name, { kind: "codebook", path: ["themes", idx[t.id], "name"] }, origOf(t, "name"), false)}</b>
        <span class="grow"></span>${cb.frozen ? "" : themeAsk === t.id
          ? `<span class="row"><span class="muted">The list is approved: removing this theme means approving it again, and the interviews are then re-read.</span>
              <button class="small" data-trm-cancel="1">Cancel</button><button class="small primary" data-trm-go="${esc(t.id)}">Remove it</button></span>`
          : `<button class="small" data-trm="${esc(t.id)}" title="Take this theme out; its findings become 'not placed'. You can put it back.">Remove</button>`}</div>
        <div>${etext(`t-${t.id}-d`, t.definition, { kind: "codebook", path: ["themes", idx[t.id], "definition"] }, origOf(t, "definition"))}</div>
        <details><summary>${t.sub_themes.length} sub-themes, ${t.sub_themes.reduce((n, s) => n + s.representative_codes.length, 0)} findings</summary>
          ${t.sub_themes.map(s => `<div style="margin:6px 0 0 12px"><b>${esc(s.id)} ${esc(s.name)}</b><div class="muted">${s.representative_codes.map(esc).join(" · ")}</div></div>`).join("")}</details></div>`;
    return `${errorBox()}${done ? banner(st.frozen ? "The theme list is frozen." : "Approved. The re-reads run by themselves.", "Status")
        : ""}
      <div class="card"><div class="spread"><h2 style="margin:0">Theme list ${tip("A theme is a pattern across what was said, named as a mechanism ('policy exists but nobody has read it'), not a topic. Sub-themes group the findings it rests on; main themes group the themes.")}</h2><span class="row">${srcTag("ai")}${cb.frozen ? "" : aiActions("codebook", "the theme list")}</span></div>
        <p class="muted">Click ✎ to reword a theme or a main theme: the AI's original is kept, and an approved list stays approved.</p>
        <p class="muted">From every finding of ${st.includes.length} interview(s) · built ${esc(cb.built)} · ${cb.frozen ? "frozen" : st.approved ? "approved" : "waiting for your approval"}</p></div>
      ${done ? "" : (() => { const thin = (cb.themes || []).filter(t => t.sub_themes.reduce((k, x) => k + x.representative_codes.length, 0) < 3);
        const ungrouped = (cb.themes || []).filter(t => !grouped.has(t.id));
        return `<div class="card attn"><h3>Worth a look before you approve</h3>
          ${thin.length ? `<h4>Themes resting on fewer than 3 findings</h4>${thin.map(t => `<div class="item">${esc(t.id)} ${etext(`tw-${t.id}`, t.name, { kind: "codebook", path: ["themes", idx[t.id], "name"] }, origOf(t, "name"), false)}</div>`).join("")}` : ""}
          ${(cb.unplaced || []).length ? `<h4>Findings placed in no theme</h4><div class="item">${cb.unplaced.length} finding${cb.unplaced.length > 1 ? "s" : ""} <button class="link" data-jump="unplaced">see them below</button></div>` : ""}
          ${ungrouped.length ? `<h4>Themes in no main theme</h4>${ungrouped.map(t => `<div class="item">${esc(t.name)}</div>`).join("")}` : ""}
          ${!thin.length && !(cb.unplaced || []).length && !ungrouped.length ? '<p class="muted">Nothing unusual: every theme rests on 3 findings or more, every finding is placed.</p>' : ""}
          <p class="muted">Then read the main themes below; rename any that do not fit.</p></div>`; })()}
      ${(cb.groups || []).map((g, gi) => `<div class="card group" style="--gc: var(--g${(gi % 6) + 1})"><div class="row"><span class="gtag">${esc(g.id)}</span>
          <h3>${etext(`g-${gi}`, g.name, { kind: "codebook", path: ["groups", gi, "name"] }, origOf(g, "name"), false)}</h3></div>
          <p>${esc(g.tests)}</p>${g.themes.map(id => byId[id]).filter(Boolean).map(theme).join("")}</div>`).join("")}
      ${(cb.themes || []).some(t => !grouped.has(t.id)) ? `<div class="card"><h3>Not in a main theme</h3>${cb.themes.filter(t => !grouped.has(t.id)).map(theme).join("")}</div>` : ""}
      ${(cb.removed_by_researcher || []).length ? `<div class="card off-card"><h3>Removed by you</h3>
          <p class="muted">Left out of the analysis; the agents will not recreate them. Their findings are listed under "not placed" below.</p>
          ${cb.removed_by_researcher.map(r => `<div class="item spread"><span><b>${esc(r.theme.name)}</b> <span class="muted">· ${esc(r.theme.definition || "")}</span></span>
            ${cb.frozen ? "" : `<button class="small" data-trs="${esc(r.theme.id)}">Put back</button>`}</div>`).join("")}</div>` : ""}
      ${(cb.unplaced || []).length ? `<div class="card" id="sec-unplaced"><h3>Findings not placed in a theme</h3>${cb.unplaced.map(u => `<div class="item"><b>${esc(u.code)}</b><div class="muted">${esc(u.reason)}</div></div>`).join("")}</div>` : ""}
      ${done ? "" : `<div class="row actions"><span class="rule">Reword any wrong theme (✎), then approve.</span>
        <label class="opt freeze"><input type="checkbox" id="freeze"> <b>Freeze the list</b> <span class="muted">(final: later interviews no longer add themes. Not frozen: each new interview extends the list, and every interview is re-read after you approve it again)</span></label>
        <button class="primary" data-act="codebook-approve">Approve</button></div>`}`;
  },

  async final() {
    const iv = project.interviews.find(x => x.slug === view.slug);
    if (!iv) return GONE;
    const d = cache.final ??= await api(`projects/${view.pid}/file/final/${view.slug}`);
    const r = d.recode || {}, l = d.latent || {}, done = iv.final_approved;
    const q = (x) => x && x.text ? `<blockquote>“${esc(x.text)}”${x.speaker ? ` (${esc(x.speaker)}` : " ("}${x.timestamp ? `, ${esc(x.timestamp)}` : ""})</blockquote>` : "";
    const LV = { primary: ["ok", "central"], secondary: ["plain", "present"], tangential: ["grey", "minor"], absent: ["grey", "absent"] };
    return `${errorBox()}${view.screen === "review" ? "" : `<h2 class="pg">${esc(iv.label)} · re-read and behind the lines</h2>`}
      ${done ? banner("Approved. This interview is part of the findings report.", "Status") : ""}
      ${(() => { const fixes = r.corrections_to_earlier_coding || [], misses = r.themes_the_codebook_misses || [];
        const lowr = (l.readings || []).filter(x => x.confidence === "low");
        const against = (l.desk_research_check || []).filter(x => ["complicates", "contradicts"].includes(x.does_this_interview_support_it));
        return `<div class="card attn"><div class="spread"><h3 style="margin:0">${done ? "What was flagged" : "Worth a look before you approve"}</h3>
            <span class="row"><span class="muted">Re-read:</span>${aiActions(`reread:${iv.slug}`, "the re-read")}
              <span class="muted">Behind the lines:</span>${aiActions(`latent:${iv.slug}`, "behind the lines")}</span></div>
          ${fixes.length ? `<h4>What the re-read corrected in the first reading</h4>${fixes.map(x => `<div class="item"><b>${esc(x.what_was_coded)}</b><div>${esc(x.what_the_full_reading_shows)}</div></div>`).join("")}` : ""}
          ${misses.length ? `<h4>Topics in this interview that no theme covers</h4>${misses.map(x => `<div class="item">${esc(x.description)}</div>`).join("")}
            <div class="row"><span class="muted"><b>What you can do:</b> nothing, if it is minor; if it matters, ask for a theme that covers it with ✦ Refine on the theme list.</span>
              <button class="small" data-go="codebook">Open the theme list</button></div>` : ""}
          ${against.length ? `<h4>Earlier conclusions this interview complicates or contradicts</h4>${against.map(x => `<div class="item"><b>${esc(x.prior_conclusion)}</b> <span class="tag plain">${esc(x.does_this_interview_support_it)}</span><div class="muted">${esc(x.note)}</div></div>`).join("")}` : ""}
          ${lowr.length ? `<h4>Readings behind the lines with low confidence</h4>${lowr.map(x => { const i = (l.readings || []).indexOf(x);
            return `<div class="item">${etext(`lw-${i}`, x.reading || "", { kind: "latent", slug: iv.slug, path: ["readings", i, "reading"] }, origOf(x, "reading"))}</div>`; }).join("")}` : ""}
          ${!fixes.length && !misses.length && !against.length && !lowr.length ? '<p class="muted">Nothing unusual: no correction, nothing the theme list misses, no low-confidence reading.</p>' : ""}
          <h4>In one paragraph</h4><p>${esc(l.synthesis || r.document_summary || "")}</p></div>`; })()}
      <details class="more"><summary>The full re-read and the reading behind the lines ${kindTag("info")}</summary>
      <div class="card"><div class="spread"><h2 style="margin:0">${esc(iv.label)}: re-read against the themes</h2>${srcTag("ai")}</div>
        <p class="muted">Done by an agent, checked by the program. Click ✎ to reword: the AI's original is kept.</p>
        <p>${etext("r-sum", r.document_summary || "", { kind: "recode", slug: iv.slug, path: ["document_summary"] }, origOf(r, "document_summary"))}</p>
        ${(r.theme_codings || []).map((c, i) => `<div class="item"><div class="spread"><b>${esc(c.theme_id)} ${esc(c.theme_name)}</b>
          <span class="tag ${(LV[c.relevance] || ["grey"])[0]}">${(LV[c.relevance] || ["", c.relevance])[1]}</span></div>
          <div>${etext(`r-${i}`, c.summary || "", { kind: "recode", slug: iv.slug, path: ["theme_codings", i, "summary"] }, origOf(c, "summary"))}</div>${q(c.best_quote)}<div class="muted">Fit with the theme list: ${esc(c.codebook_fit)}. ${esc(c.fit_note)}</div></div>`).join("")}
        <h4>Topics in this interview that no theme covers</h4>${(r.themes_the_codebook_misses || []).map(x => `<div class="item">${esc(x.description)}</div>`).join("") || '<p class="muted">None.</p>'}

// A first answer to "who is who", so the researcher only checks it: interviewers already named in
// the project's other interviews are interviewers again; of the rest, the one who talks most is the
// interviewee, the others interviewers. "Speaker 1"-style labels mean someone different in each
// transcript, so they are never remembered. The only profile not used yet is pre-selected.
function guessSpeakers(p, iv, labels) {
  const generic = /^(speaker|participant|interlocutor|person|\(no speaker names\))\s*\d*$/i;
  const known = {}, used = new Set();
  p.interviews.filter(o => o.slug !== iv.slug).forEach(o => Object.values(o.speakers || {}).forEach(sp => {
    if (sp.role !== "interviewee" && !generic.test(sp.label)) known[sp.label] = sp.role;
    if (sp.profile?.id) used.add(sp.profile.id);
  }));
  const out = {};
  labels.forEach(l => { if (known[l.label]) out[l.label] = { role: known[l.label] }; });
  const rest = labels.filter(l => !out[l.label]).sort((a, b) => (b.words || 0) - (a.words || 0));
  const free = (p.profiles || []).filter(pr => !used.has(pr.id));
  rest.forEach((l, i) => {
    out[l.label] = i === 0 ? { role: "interviewee", profile: free.length === 1 ? { id: free[0].id } : undefined } : { role: "interviewer" };
  });
  return out;
}

async function render() {
  document.getElementById("crumb").textContent = project ? "› " + project.name : "";
  const name = view.screen in screens ? view.screen : "home";
  if (!["home", "new"].includes(name) && !project) { view = { screen: "home" }; return render(); }
  const side = document.getElementById("side"), layout = document.getElementById("layout");
  const key0 = `${name}|${view.slug || ""}`;
  side.hidden = false;
  layout.classList.remove("noside");
  const sq = document.getElementById("psearch"), sv = sq ? sq.value : null, sf = sq && document.activeElement === sq;
  side.innerHTML = sidebar(project);
  const sq2 = document.getElementById("psearch");  // what is being typed in the search box survives the self-refresh
  if (sq2 && sv !== null && key0 === lastRendered) { sq2.value = sv; if (sf) sq2.focus(); }
  const bar = "";
  // The page redraws itself every few seconds while a step runs: keep what the researcher opened or closed.
  const key = `${name}|${view.slug || ""}`;
  const kept = key === lastRendered ? Object.fromEntries([...app.querySelectorAll("details[id]")].map(d => [d.id, d.open])) : {};
  const keptAll = key === lastRendered ? [...app.querySelectorAll("details:not([id])")].map(d => d.open) : null;
  const ctlKey = (el) => el.id || [...el.attributes].filter(a => a.name.startsWith("data-") || a.name === "name").map(a => `${a.name}=${a.value}`).join("|")
    + (el.type === "radio" ? `|v=${el.value}` : "");
  const ctls = key === lastRendered ? new Map([...app.querySelectorAll("input, select, textarea")].filter(el => el.type !== "file").map(el =>
    [ctlKey(el), el.type === "checkbox" || el.type === "radio" ? { checked: el.checked }
      : { value: el.value, sel: el === document.activeElement && "selectionStart" in el ? [el.selectionStart, el.selectionEnd] : null }])) : null;
  // Long boxes (a live log) keep their scroll place; at the bottom, they follow the newest lines.
  const scrolls = key === lastRendered ? [...app.querySelectorAll("pre.log, .ctx")].map(e => ({ top: e.scrollTop, end: e.scrollTop + e.clientHeight >= e.scrollHeight - 4 })) : null;
  const pageY = window.scrollY;
  const focus = key === lastRendered ? document.activeElement?.id : "";
  const framed = project && !["home", "new"].includes(name);
  try { app.innerHTML = bar + (framed ? stepper(project) : "") + await screens[name]() + (framed ? footer(project) : ""); }
  catch (e) { app.innerHTML = `${bar}<div class="error">${esc(e.message)}</div>`; }
  for (const [id, open] of Object.entries(kept)) { const d = document.getElementById(id); if (d) d.open = open; }
  if (keptAll) { const all = [...app.querySelectorAll("details:not([id])")]; if (all.length === keptAll.length) all.forEach((d, i) => { d.open = keptAll[i]; }); }
  let selection = null;
  if (ctls) [...app.querySelectorAll("input, select, textarea")].forEach(el => {
    const w = ctls.get(ctlKey(el));
    if (!w) return;
    if ("checked" in w) { el.checked = w.checked; return; }
    if (el.value !== w.value) { el.value = w.value; if (el.dataset.setupWho) el.dispatchEvent(new Event("change", { bubbles: true })); }
    if (w.sel) selection = [el, w.sel];
  });
  if (focus) document.getElementById(focus)?.focus();
  if (selection) { try { selection[0].focus(); selection[0].setSelectionRange(...selection[1]); } catch {} }
  if (document.getElementById("f-text")) applyFilters();
  if (scrolls) {
    const boxes = [...app.querySelectorAll("pre.log, .ctx")];
    if (boxes.length === scrolls.length) boxes.forEach((e, i) => { e.scrollTop = scrolls[i].end && name === "log" ? e.scrollHeight : scrolls[i].top; });
    window.scrollTo(0, pageY);
  }
  const nb = app.querySelector(".next-act .primary");  // one primary action per screen
  if (nb && [...app.querySelectorAll(".primary")].some(x => x !== nb && !x.closest(".stepper"))) nb.closest(".next-act").remove();
  // Arriving in Review, nothing keeps the focus, so Enter approves and → moves on (and no button is pressed by mistake).
  if (name === "review" && key !== lastRendered && document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  if (key !== lastRendered) {  // opened at a section: Results › Quotes, Results › Cross-analysis
    const anchor = name === "cross" ? "cross" : name === "results" ? view.step : "";
    if (anchor) document.getElementById("sec-" + anchor)?.scrollIntoView({ block: "start" });
  }
  lastRendered = key;
}

function readFile(file) {
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => bad(new Error("The file could not be read."));
    r.readAsDataURL(file);
  });
}
