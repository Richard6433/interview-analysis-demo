<script>
// The demo's stand-in for the platform's server. It runs in the browser: it answers the page's
// requests (/api/...) the way app.py would, from invented material (window.DEMO), and makes each
// AI step "work" for a few seconds. Nothing is sent anywhere; progress is kept in this browser.
(() => {
  "use strict";
  const D = window.DEMO;
  const KEY = "interview-demo-state-v1", PV = "2.0.0 (demo)";
  const DUR = { check: 2500, read: 5000, codebook: 3500, reread: 3000, latent: 3000, cross: 4000, report: 3500 };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const nowIso = () => new Date().toISOString().slice(0, 19);
  const secs = () => Date.now() / 1000;
  const err = (msg, status = 400, extra = {}) => Object.assign(new Error(msg), { status, extra });

  // ---------------------------------------------------------------- state, kept in this browser
  function freshState() {
    return { projects: [newProject("ai-in-transparency-organisations-demo", "AI in transparency organisations (demo)", D.question, D.subs, [])] };
  }
  function newProject(id, name, question, subs, priors, profiles = []) {
    return { id, name, question, sub_questions: subs, priors, profiles, interviews: [], jobs: {}, running: null, cb: null,
             cross: null, reports: [], shareable: [], reportText: null, data: {}, context_changed_at: 0, created: nowIso(), updated: nowIso() };
  }
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || freshState(); } catch { S = freshState(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const proj = (pid) => { const p = S.projects.find(x => x.id === pid); if (!p) throw err("Not found", 404); p.updated = nowIso(); return p; };
  const ivOf = (p, slug) => { const iv = p.interviews.find(x => x.slug === slug); if (!iv) throw err("Not found", 404); return iv; };
  const sample = (iv) => D.samples[iv.sample];
  const profileText = (pr) => [pr.role, pr.org_type, pr.sector].filter(Boolean).join(", ");

  // ---------------------------------------------------------------- the steps of one interview (as app.steps_for)
  const STEP = [
    ["extract", 1, "Transcript added, text extracted", "program", "the platform (pipeline.py)"],
    ["speakers", "★", "You say who is who: who listens, who speaks, and their profile", "you", "you"],
    ["check", 2, "Transcript check: who is who, misheard words, wrong labels", "agent", "agents.py check (1 agent, claude -p)"],
    ["confirm-check", "★", "You confirm the transcript check", "you", "you"],
    ["list", 3, "Transcript list (dates, word counts)", "program", "guide.py prepare (ta.py manifest)"],
    ["split", 4, "Cut into 4 parts, blank forms, each reader's brief", "program", "guide.py split, then guide.py brief"],
    ["readers", 5, "The five readers (4 parts + the whole interview)", "agent", "agents.py read (5 agents at once, claude -p)"],
    ["checks", 6, "Checks: all five present, well-formed, every quote word for word", "program", "guide.py check (ta.py verify-excerpts)"],
    ["counts", 7, "Count of findings per question", "program", "ta.py coverage"],
    ["themes", 8, "Theme list: findings grouped into themes (shared by the project)", "agent", "agents.py codebook (1 agent, claude -p)"],
    ["approve-themes", "★", "You approve the theme list", "you", "you"],
    ["reread", 9, "Re-read the whole interview against the themes", "agent", "agents.py reread (1 agent, claude -p)"],
    ["latent", 10, "Behind the lines", "agent", "agents.py latent (1 agent, claude -p)"],
    ["approve-final", "★", "You approve the analysis of this interview", "you", "you"],
  ];
  function coverage(p, iv) {
    const counts = {};
    allCodes(p, iv).forEach(c => { counts[c.sub_question] = (counts[c.sub_question] || 0) + 1; });
    return Object.entries(counts).sort().map(([k, n]) => `  ${k.padEnd(6)} ${String(n).padStart(3)}  ${k === "none" ? "Important, but outside the questions" : (p.sub_questions[+k.slice(2) - 1] || "Bears on the research question")}`);
  }
  function stepsFor(p, iv) {
    const s = iv.slug, run = p.running;
    const job = (key, done) => run === key ? "running" : p.jobs[key]?.status === "failed" ? "failed" : done ? "done" : "todo";
    const inCb = !!(p.cb && (p.cb.includes.includes(s) || p.cb.frozen));
    const readRun = run === `${s}:read`;
    const sub = (done) => readRun && !done ? "running" : done ? "done" : "todo";
    const st = {
      extract: iv.status === "extracting" ? "running" : iv.status === "error" ? "failed" : "done",
      speakers: iv.speakers_set ? "done" : iv.status === "ready" ? "you" : "todo",
      check: job(`${s}:check`, iv.checkDone),
      "confirm-check": iv.check_approved ? "done" : iv.checkDone ? "you" : "todo",
      list: sub(iv.readDone), split: sub(iv.readDone), readers: sub(iv.readDone), checks: sub(iv.readDone), counts: sub(iv.readDone),
      themes: run === "codebook" ? "running" : inCb ? "done" : "todo",
      "approve-themes": inCb && p.cb.approved ? "done" : inCb ? "you" : "todo",
      reread: job(`${s}:reread`, iv.rereadDone),
      latent: job(`${s}:latent`, iv.latentDone),
      "approve-final": iv.final_approved ? "done" : iv.rereadDone && iv.latentDone ? "you" : "todo",
    };
    const log = { check: `${s}:check`, list: `${s}:read`, split: `${s}:read`, readers: `${s}:read`, checks: `${s}:read`, counts: `${s}:read`,
                  themes: "codebook", reread: `${s}:reread`, latent: `${s}:latent` };
    return STEP.map(([id, n, title, who, script]) => ({ id, n, title, who, script, about: "", state: st[id], log: log[id],
      lines: id === "counts" && iv.readDone ? coverage(p, iv) : [], detail: id === "extract" ? iv.message || "" : "" }));
  }

  // ---------------------------------------------------------------- what runs next (as app.next_job)
  function nextJob(p) {
    for (const iv of p.interviews) {
      if (iv.status !== "ready" || !iv.speakers_set) continue;
      if (!iv.checkDone) return `${iv.slug}:check`;
      if (iv.check_approved && !iv.readDone) return `${iv.slug}:read`;
    }
    const coded = p.interviews.filter(iv => iv.readDone);
    if (coded.length && !(p.cb && p.cb.frozen) && coded.some(iv => !p.cb || !p.cb.includes.includes(iv.slug)))
      return p.jobs.codebook?.status === "failed" ? null : "codebook";
    if (!p.cb || !p.cb.approved) return null;
    for (const iv of coded) {
      if (!p.cb.includes.includes(iv.slug)) continue;
      if (!iv.rereadDone) return `${iv.slug}:reread`;
      if (!iv.latentDone) return `${iv.slug}:latent`;
    }
    const ok = p.interviews.filter(iv => iv.final_approved).map(iv => iv.slug);
    const inReview = coded.some(iv => !iv.final_approved && iv.latentDone);  // it joins soon: wait for it
    if (ok.length >= 2 && p.jobs.cross?.status !== "failed" && !inReview) {
      const from = p.cross ? p.cross.interviews : [];
      if (!p.cross || ok.some(x => !from.includes(x)) || from.some(x => !p.interviews.some(iv => iv.slug === x))) return "cross";
    }
    return null;
  }
  function advance(p) {
    if (p.running) return;
    const q = (p.queued || []).shift();  // asked for while another step ran: it comes first
    const key = q ? q[0] : nextJob(p);
    if (key) start(p, key);
  }
  // As app.queue_job: a Refine or Regenerate asked for while another step runs waits its turn.
  function runOrQueue(p, key, note) {
    if (!p.running) return start(p, key);
    p.queued = (p.queued || []).filter(q => q[0] !== key).concat([[key, note ? [`--note=${note}`] : []]]);
  }
  function start(p, key) {
    p.running = key;
    p.jobs[key] = { status: "running", started: nowIso(), log: key.replace(":", "--") + ".log", pipeline_version: PV };
    save();
    setTimeout(() => finish(p.id, key), DUR[key.split(":").pop()] || 3000);
  }
  function finish(pid, key) {
    const p = S.projects.find(x => x.id === pid);
    if (!p || p.running !== key) return;
    const [slug, step] = key.includes(":") ? key.split(":") : ["", key];
    const iv = slug ? p.interviews.find(x => x.slug === slug) : null;
    if (slug && !iv) { p.running = null; save(); return; }
    const d = slug ? (p.data[slug] ||= {}) : null;
    switch (step) {
      case "check": d.meta = metaFor(p, iv); iv.checkDone = true; break;
      case "read": d.codes = clone(sample(iv).codes); iv.readDone = true; break;
      case "codebook": buildCodebook(p); break;
      case "reread": d.recode = clone(sample(iv).recode); iv.rereadDone = true; break;
      case "latent": d.latent = clone(sample(iv).latent); iv.latentDone = true; break;
      case "cross": buildCross(p); break;
      case "report": buildReport(p); break;
    }
    Object.assign(p.jobs[key], { status: "done", ended: nowIso(), ended_at: secs() });
    p.running = null;
    save();
    advance(p);
  }
  // A running step does not survive closing the page: it finishes when the page opens again.
  S.projects.forEach(p => { if (p.running) setTimeout(() => finish(p.id, p.running), 1500); });

  function metaFor(p, iv) {
    const m = clone(sample(iv).meta);
    const who = Object.values(iv.speakers || {}).find(x => x.role === "interviewee");
    m.speaker_map = { [D.interviewer]: "interviewer", [sample(iv).interviewee]: who?.profile ? `interviewee: ${profileText(who.profile)}` : "interviewee" };
    return m;
  }
  function allCodes(p, iv) {
    const c = p.data[iv.slug]?.codes || {};
    return Object.values(c).filter(Boolean).flatMap(f => f.codes).filter(x => !x.removed_by_researcher);
  }
  function buildCodebook(p) {
    const coded = p.interviews.filter(iv => iv.readDone);
    const labels = new Set(coded.flatMap(iv => allCodes(p, iv).map(c => c.code)));
    const old = Object.fromEntries((p.cb?.data?.themes || []).map(t => [t.id, t]));
    const oldG = Object.fromEntries((p.cb?.data?.groups || []).map(g => [g.id, g]));
    const themes = D.themes.map(t => ({ id: t.id, name: t.name, definition: t.definition, group: t.group,
      sub_themes: [{ id: `${t.id}.1`, name: t.name, representative_codes: t.codes.filter(c => labels.has(c)) }] }))
      .filter(t => t.sub_themes[0].representative_codes.length)
      .map(t => old[t.id] ? { ...t, name: old[t.id].name, definition: old[t.id].definition, edited_by_researcher: old[t.id].edited_by_researcher } : t);
    const ids = new Set(themes.map(t => t.id));
    const groups = D.groups.map(g => ({ id: g.id, name: oldG[g.id]?.name || g.name, tests: g.tests, themes: D.themes.filter(t => t.group === g.id && ids.has(t.id)).map(t => t.id),
      edited_by_researcher: oldG[g.id]?.edited_by_researcher })).filter(g => g.themes.length);
    p.cb = { includes: coded.map(iv => iv.slug), approved: false, frozen: false,
             data: { themes, groups, unplaced: [], built: nowIso().slice(0, 10), status: "DRAFT" } };
  }
  function buildCross(p) {
    const ok = p.interviews.filter(iv => iv.final_approved);
    const bySample = Object.fromEntries(ok.map(iv => [iv.sample, iv]));
    const cbIds = new Set((p.cb?.data?.themes || []).map(t => t.id));
    const X = D.cross;
    const prof = (iv) => Object.values(iv.speakers || {}).find(x => x.profile)?.profile;
    p.cross = { interviews: ok.map(iv => iv.slug), data: {
      overview: X.overview, built: nowIso().slice(0, 10), interviews: ok.map(iv => iv.slug),
      by_theme: Object.entries(X.by_theme).filter(([t]) => cbIds.has(t)).map(([theme_id, v]) => ({ theme_id, shared: v[0], differences: v[1], by_profile: v[2] })),
      by_profile: ok.map(iv => ({ profile: prof(iv) ? profileText(prof(iv)) : iv.label, what_stands_out: X.by_profile[iv.sample] })),
      patterns: X.patterns.map(pt => ({ pattern: pt.pattern, interviews: pt.samples.filter(s => bySample[s]).map(s => bySample[s].slug),
        evidence: pt.evidence.filter(e => bySample[e.sample]).map(e => ({ slug: bySample[e.sample].slug, text: e.text })) })).filter(pt => pt.evidence.length),
      divergences: X.divergences.filter(v => v.samples.every(s => bySample[s])).map(v => ({ about: v.about, interviews: v.samples.map(s => bySample[s].slug), how_they_differ: v.how })),
      limits: X.limits } };
  }
  function buildReport(p) {
    const ok = p.interviews.filter(iv => iv.final_approved);
    const n = p.reports.length + 1, which = ok.map(iv => iv.n).join("-");
    p.reports.unshift(`interim-findings-v${n}-interviews-${which}.docx`);
    p.shareable.unshift(`interim-findings-v${n}-interviews-${which}-shareable.docx`);
    const themes = {};
    (p.cb?.data?.themes || []).forEach(t => {
      const per = {};
      ok.forEach(iv => { const txt = D.report_theme_text[t.id]?.[iv.sample]; if (txt) per[iv.slug] = txt; });
      themes[t.id] = { what: t.definition, ...per };
    });
    p.reportText = { title: D.report.title, takeaways: D.report.takeaways, limits: D.report.limits, themes, _about: "Written by agents.py (stage 5) from the checked files." };
  }

  // ---------------------------------------------------------------- the project as the page sees it (as app.view)
  function summary(p, iv) {
    const d = p.data[iv.slug] || {}, m = d.meta || {}, codes = allCodes(p, iv), rc = d.recode || {}, lt = d.latent || {};
    const q = codes.reduce((k, c) => k + (c.excerpts || []).length, 0);
    return { speakers: Object.keys(m.speaker_map || {}).length, misheard: Object.keys(m.misheard_words || {}).length,
      corrections: (m.speaker_corrections || []).length, names: (m.identifying_terms || []).length, suggested_profile: m.suggested_profile || {},
      findings: codes.length, low: codes.filter(c => c.confidence === "low").length, quotes: iv.readDone ? `${q}/${q}` : "",
      central: (rc.theme_codings || []).filter(c => c.relevance === "primary").length, themes: (rc.theme_codings || []).length,
      fixes: (rc.corrections_to_earlier_coding || []).length, misses: (rc.themes_the_codebook_misses || []).length,
      readings: (lt.readings || []).length, low_readings: (lt.readings || []).filter(r => r.confidence === "low").length,
      silences: (lt.silences || []).length, against: 0 };
  }
  function view(p) {
    const cb = p.cb;
    const out = {
      id: p.id, name: p.name, question: p.question, sub_questions: p.sub_questions, priors: p.priors, profiles: p.profiles,
      interviews: p.interviews.map(iv => ({ ...iv })), jobs: p.jobs, running: p.running, queued: p.queued || [], updated: p.updated, created: p.created,
      context_changed_at: p.context_changed_at, codebook_approved_at: 0,
      steps: Object.fromEntries(p.interviews.map(iv => [iv.slug, stepsFor(p, iv)])),
      codebook: { exists: !!cb, approved: !!(cb && cb.approved), frozen: !!(cb && cb.frozen), themes: cb ? cb.data.themes.length : 0, includes: cb ? cb.includes : [] },
      reports: p.reports, shareable_reports: p.shareable, report_job: p.jobs.report || {},
      pipeline_version: PV, model: "simulated in the demo (no AI is called)", provenance: {},
      summaries: Object.fromEntries(p.interviews.map(iv => [iv.slug, summary(p, iv)])),
      cross: { exists: !!p.cross, job: p.jobs.cross || {}, approved: p.interviews.filter(iv => iv.final_approved).map(iv => iv.label), built_from: p.cross ? p.cross.interviews : [] },
    };
    return out;
  }

  // ---------------------------------------------------------------- quotes: every one checked (as app.quotes)
  const FILLERS = new Set(["uh", "um", "umm", "uhm", "er", "erm", "ah", "eh", "hmm", "mm", "mhm"]);
  const words = (t) => t.toLowerCase().replace(/’/g, "'").replace(/[^\w']+/g, " ").split(" ").filter(w => w && !FILLERS.has(w));
  function lineOf(q, lines) {
    const head = q.slice(0, 60);
    let i = lines.findIndex(l => head && l.includes(head));
    if (i >= 0) return i;
    const want = new Set(words(q));
    let best = 0, score = -1;
    lines.forEach((l, k) => { const w = words(l); const hit = w.filter(x => want.has(x)).length / Math.max(1, Math.max(w.length, want.size)); if (hit > score) { score = hit; best = k; } });
    return best;
  }
  function checkQuote(q, text, lines, first) {
    let status;
    if (q && (text.includes(q) || text.toLowerCase().includes(q.toLowerCase()))) status = first ? "partial" : "verified";
    else { const w = words(q).join(" "); status = w && words(text).join(" ").includes(w) ? "partial" : "not_found"; }
    const n = lineOf(q, lines), out = { status, line: n + 1 };
    if (status !== "verified") out.context = lines.slice(Math.max(0, n - 2), n + 3).map((t, k) => ({ n: Math.max(0, n - 2) + k + 1, text: t, hit: Math.max(0, n - 2) + k === n }));
    if (first) out.first_written = first;
    return out;
  }
  function quotes(p) {
    const items = [];
    const label = Object.fromEntries(p.interviews.map(iv => [iv.slug, iv.label]));
    const add = (slug, where, q, edit, first) => {
      const iv = p.interviews.find(x => x.slug === slug);
      if (!q || !iv) return;
      const t = sample(iv).text;
      items.push({ slug, interview: label[slug], where, text: q, edit, ...checkQuote(q, t, t.split("\n"), first) });
    };
    p.interviews.forEach(iv => {
      const d = p.data[iv.slug] || {};
      Object.entries(d.codes || {}).forEach(([part, f]) => (f?.codes || []).forEach((c, i) => {
        if (c.removed_by_researcher) return;
        (c.excerpts || []).forEach((q, n) => add(iv.slug, `Finding: ${c.code}`, q, { kind: "codes", slug: iv.slug, part, path: ["codes", i, "excerpts", n] },
          (c.quote_repairs || []).find(r => r.to === q)?.from));
      }));
      (d.recode?.theme_codings || []).forEach((c, i) => add(iv.slug, `Re-read: ${c.theme_name}`, c.best_quote?.text, { kind: "recode", slug: iv.slug, path: ["theme_codings", i, "best_quote", "text"] }));
      (d.latent?.readings || []).forEach((x, i) => (x.surface_evidence || []).forEach((e, n) => add(iv.slug, `Behind the lines: ${x.reading.slice(0, 80)}`, e.text,
        { kind: "latent", slug: iv.slug, path: ["readings", i, "surface_evidence", n, "text"] })));
    });
    (p.cross?.data?.patterns || []).forEach((x, i) => (x.evidence || []).forEach((e, n) => add(e.slug, `Cross-analysis: ${x.pattern}`, e.text,
      { kind: "cross", slug: "", path: ["patterns", i, "evidence", n, "text"] })));
    const order = { not_found: 0, partial: 1, verified: 2 };
    items.sort((a, b) => order[a.status] - order[b.status] || a.interview.localeCompare(b.interview) || a.line - b.line);
    const count = { not_found: 0, partial: 0, verified: 0 };
    items.forEach(x => { count[x.status]++; });
    return { count, total: items.length, items };
  }

  // ---------------------------------------------------------------- editing what the AI produced (as app.edit_item)
  const EDITABLE = new Set(["code", "description", "interpretation", "name", "definition", "summary", "document_summary", "synthesis", "reading",
    "overview", "shared", "differences", "by_profile", "what_stands_out", "pattern", "how_they_differ", "limits", "text", "excerpts"]);
  function editItem(p, b) {
    const cannot = "This part cannot be edited.";
    const doc = b.kind === "codes" ? p.data[b.slug]?.codes?.[b.part] : b.kind === "codebook" ? p.cb?.data
      : b.kind === "recode" ? p.data[b.slug]?.recode : b.kind === "latent" ? p.data[b.slug]?.latent : b.kind === "cross" ? p.cross?.data : null;
    const path = b.path;
    if (!doc || !Array.isArray(path) || !path.length) throw err(cannot);
    let node = doc, owner = doc, rel = [];
    for (const k of path.slice(0, -1)) {
      node = node?.[k]; rel.push(String(k));
      if (node === undefined || node === null) throw err(cannot);
      if (!Array.isArray(node) && typeof node === "object") { owner = node; rel = []; }
    }
    const last = path[path.length - 1];
    if (typeof node !== "object" || !(last in node)) throw err(cannot);
    const current = node[last];
    rel.push(String(last));
    if (b.remove !== undefined && b.remove !== null) {
      if (b.kind !== "codes" || typeof current !== "object") throw err(cannot);
      current.removed_by_researcher = !!b.remove;
      (current.edited_by_researcher ||= { original: {} }).at = nowIso();
      return;
    }
    const field = typeof last === "string" ? last : String(path[path.length - 2]);
    if (!EDITABLE.has(field) || typeof current !== "string") throw err(cannot);
    const value = String(b.value || "").trim();
    if (!value) throw err("The new text is empty.");
    if (field === "excerpts" || field === "text") {
      const slug = b.kind === "cross" ? owner.slug : b.slug;
      const iv = p.interviews.find(x => x.slug === slug);
      if (!iv || !sample(iv).text.includes(value)) throw err("This quote is not in the transcript word for word. Copy it exactly from the highlighted line.");
    }
    const mark = (owner.edited_by_researcher ||= { original: {} });
    mark.at = nowIso();
    if (!(("@" + rel.join(".")) in mark.original)) mark.original["@" + rel.join(".")] = current;
    node[last] = value;
  }

  // ---------------------------------------------------------------- the requests
  const json = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { "Content-Type": "application/json" } });
  const text = (t) => new Response(t, { status: 200, headers: { "Content-Type": "text/plain; charset=utf-8" } });
  const file = (name, body) => new Response(new Blob([body], { type: "text/plain" }), { status: 200, headers: { "Content-Type": "text/plain", "Content-Disposition": `attachment; filename="${name}"` } });
  const demoFile = (what) => `Interview analysis platform: demo download\n\nIn the real platform, this is ${what}.\nThe demo uses invented interviews and simulated agents, so it gives this note instead.\n`;

  function logFor(p, key) {
    const j = p.jobs[key];
    if (!j) throw err("Nothing was printed for this step yet.", 404);
    const [slug, step] = key.includes(":") ? key.split(":") : ["", key];
    const iv = slug ? p.interviews.find(x => x.slug === slug) : null;
    const note = (p.notes || {})[key];
    const head = `$ uv run agents.py ${step}${iv ? " " + iv.file : ""}${note ? ` --note="${note}"` : ""}\n\n(Demo: a simulated run. No AI was called.` +
      (note ? " Your instruction was given to the agent; in the demo the result is the same pre-written example." : "") + ")\n\n";
    const body = {
      check: "Stage 0 - the transcript check (1 agent)\n  Wrote the notes: speakers, misheard words, wrong labels, names to hide.\n",
      read: iv ? `Building the transcript list (guide.py prepare)\nCutting ${iv.file} into four parts (guide.py split)\n\nStage 1 - the five readers at work at the same time (A, B, C, D, E)\n` +
        Object.entries(p.data[slug]?.codes || {}).map(([r, f]) => `  reader ${r}: ${(f?.codes || []).length} codes`).join("\n") +
        `\n\nThe program's checks (guide.py check)\n  OK - all five reader files present and well-formed.\n  ${summary(p, iv).quotes} verbatim strings verified against the transcript.\n` : "",
      codebook: "Stage 2 - grouping the codes into themes (1 agent)\n  Wrote the theme list.\n",
      reread: "Stage 3 - the re-read against the approved themes (1 agent)\n  Checked by the program.\n",
      latent: "Stage 4 - behind the lines (1 agent)\n  Checked by the program.\n",
      cross: "Stage 6 - the cross-analysis (1 agent)\n  Every quote checked against its transcript.\n",
      report: "Stage 5 - the report's wording (1 agent)\n  Built the report and its shareable copy.\n",
    }[step] || "";
    return head + body + (j.status === "running" ? "\n... running" : "\nDONE.");
  }
  function sent(p, prefix) {
    const pre = D.preamble.replace("{question}", p.question);
    const iv = p.interviews.find(x => prefix.startsWith(x.slug));
    if (prefix.endsWith("--reader") && iv) {
      if (!iv.readDone) return [];
      return sample(iv).parts.map(x => ({ name: x.reader, general: pre, words: String((pre + x.text).split(/\s+/).length),
        specific: `[the general part, shown above]\n\n## Your span (reader ${x.reader}) - code ONLY this\n\n${x.text}` }));
    }
    const what = { check: "Stage 0 — transcript check", reread: "Stage 3 — re-read", latent: "Stage 4 — behind the lines", codebook: "Stage 2 — theme list", cross: "Stage 6 — cross-analysis" };
    const k = Object.keys(what).find(x => prefix.endsWith(x));
    if (!k || !p.jobs[iv ? `${iv.slug}:${k}` : k]) return [];
    const note = (p.notes || {})[iv ? `${iv.slug}:${k}` : k];
    return [{ name: prefix, general: pre, words: "about 3,000", specific: `[the general part, shown above]\n\n## ${what[k]}\n\n${(D.stages.find(s => s.heading === what[k]) || {}).text || ""}` +
      (note ? `\n\n## The researcher's instruction for this run\n${note}` : "") + "\n\n(Demo: the transcript and notes would follow here.)" }];
  }
  function search(p, q) {
    const w = q.toLowerCase().split(/\s+/).filter(Boolean);
    const match = (...t) => { const b = t.join(" ").toLowerCase(); return w.length && w.every(x => b.includes(x)); };
    const hits = [];
    p.interviews.forEach(iv => allCodes(p, iv).forEach(c => {
      if (match(c.code, c.description, ...(c.excerpts || []))) hits.push({ kind: "Finding", where: iv.label, slug: iv.slug, go: "codes", title: c.code, text: c.description, quote: (c.excerpts || [])[0] || "" });
    }));
    (p.cb?.data?.themes || []).forEach(t => { if (match(t.name, t.definition)) hits.push({ kind: "Theme", where: "Theme list", slug: "", go: "codebook", title: t.name, text: t.definition, quote: "" }); });
    return hits;
  }

  // "Before you start": in the demo, Claude is simulated and always ready; no key is ever saved.
  const CLAUDE = { installed: true, version: "demo", logged_in: true, plan: "demo", unknown: false, key: "", env_key: "", ready: true, billing: "subscription" };
  // The dashboard's numbers, worked out the same way as the platform's dashboard() in app.py.
  function dashboard(p) {
    const sq = { RQ: { label: "Research question", text: p.question, findings: 0, interviews: new Set() } };
    (p.sub_questions || []).forEach((t, i) => { sq[`SQ${i + 1}`] = { label: `SQ${i + 1}`, text: t, findings: 0, interviews: new Set() }; });
    const cb = p.cb?.data || {}, themes = {};
    (cb.themes || []).forEach(t => { themes[t.id] = { id: t.id, name: t.name || t.id, group: "", gid: "", central: 0, mentioned: 0 }; });
    (cb.groups || []).forEach(g => (g.themes || []).forEach(tid => { if (themes[tid]) { themes[tid].group = g.name || g.id; themes[tid].gid = g.id; } }));
    const priors = (p.priors || []).map(t => ({ text: t, supports: 0, complicates: 0, contradicts: 0 }));
    const words = (t) => new Set(String(t || "").toLowerCase().match(/[a-z]{4,}/g) || []);
    const near = (t) => { const w = words(t); let best = -1, score = 0.4;
      priors.forEach((x, i) => { const v = words(x.text), both = [...w].filter(a => v.has(a)).length / Math.max(1, Math.min(w.size, v.size)); if (both >= score) { score = both; best = i; } });
      return best; };
    const current = !!(p.cb && p.cb.approved);
    let stale = 0, unmatched = 0, misses = 0;
    const grid = [];
    p.interviews.forEach(iv => {
      allCodes(p, iv).forEach(c => { const m = /SQ\s*(\d+)/i.exec(c.sub_question || ""); const k = m && sq[`SQ${m[1]}`] ? `SQ${m[1]}` : "RQ"; sq[k].findings++; sq[k].interviews.add(iv.slug); });
      const d = p.data[iv.slug] || {}, codings = (d.recode?.theme_codings || []).filter(c => c.theme_id);
      if (codings.length && !current) stale++;
      else if (codings.length) {
        grid.push({ slug: iv.slug, n: iv.n, label: iv.label, approved: !!iv.final_approved,
          themes: Object.fromEntries(codings.map(c => [c.theme_id, { rel: c.relevance || "", summary: c.summary || "", quote: c.best_quote?.text || "" }])) });
        misses += (d.recode.themes_the_codebook_misses || []).length;
        codings.forEach(c => { const t = themes[c.theme_id]; if (t && c.relevance === "primary") t.central++; else if (t && c.relevance === "secondary") t.mentioned++; });
      }
      (d.latent?.desk_research_check || []).forEach(x => { const k = near(x.prior_conclusion), v = x.does_this_interview_support_it;
        if (!["supports", "complicates", "contradicts"].includes(v)) return; if (k >= 0) priors[k][v]++; else unmatched++; });
    });
    const used = {};
    p.interviews.forEach(iv => Object.values(iv.speakers || {}).forEach(sp => { if (sp.role === "interviewee" && sp.profile?.id) used[sp.profile.id] = (used[sp.profile.id] || 0) + 1; }));
    return { sub_questions: Object.entries(sq).map(([id, v]) => ({ id, ...v, interviews: v.interviews.size })),
      themes: Object.values(themes).sort((a, b) => b.central - a.central || b.mentioned - a.mentioned || a.id.localeCompare(b.id)),
      priors, profiles: (p.profiles || []).map(pr => ({ id: pr.id, text: profileText(pr), role: pr.role || "", interviews: used[pr.id] || 0 })),
      misses, stale, unmatched, findings: Object.values(sq).reduce((n, v) => n + v.findings, 0), grid,
      groups: (cb.groups || []).map(g => ({ id: g.id, name: g.name, themes: g.themes || [] })) };
  }

  function get(path, qs) {
    if (path[0] === "claude") return json(CLAUDE);
    if (path.length === 1) return json(S.projects.map(p => ({ id: p.id, name: p.name, question: p.question, updated: p.updated, interviews: p.interviews.length })));
    const p = proj(path[1]);
    if (path.length === 2) return json(view(p));
    const [, , what, kind, a, b] = path;
    if (what === "log") return text(logFor(p, kind));
    if (what === "quotes") return json(quotes(p));
    if (what === "dashboard") return json(dashboard(p));
    if (what === "search") return json(search(p, qs.get("q") || ""));
    if (what === "export") {
      const c = qs.get("content"), n = p.interviews.find(iv => iv.slug === qs.get("interview"))?.n;
      const name = { all: "everything-demo.txt", interview: `interview-${n}-report-demo.txt`, "interview-shareable": `interview-${n}-report-shareable-demo.txt`,
                     cross: "cross-analysis-demo.txt", "cross-shareable": "cross-analysis-shareable-demo.txt" }[c] || `findings-table-demo.${qs.get("format") === "html" ? "html" : "txt"}`;
      return file(name, demoFile(c === "all" ? "a zip file with every report and table, full and shareable" : c && c.startsWith("table") ? "a table of every finding and theme (Excel, CSV or web page)" : "a Word report"));
    }
    if (what !== "file") throw err("Not found", 404);
    const iv = a ? p.interviews.find(x => x.slug === a) : null, d = a ? p.data[a] || {} : {};
    switch (kind) {
      case "meta": return json(d.meta || {});
      case "codes": return json(Object.fromEntries("ABCDE".split("").map(c => [c, d.codes?.[c] || null])));
      case "codebook": return json(p.cb ? { ...p.cb.data, includes: p.cb.includes, frozen: p.cb.frozen } : {});
      case "cross": return json(p.cross?.data || {});
      case "final": return json({ recode: d.recode || null, latent: d.latent || null });
      case "transcript": if (!iv) throw err("Not found", 404); return text(sample(iv).text);
      case "report-text": return json(p.reportText || {});
      case "general": return json({ file: "prompts/v1.md (demo excerpt)", preamble: D.preamble.replace("{question}", p.question), stages: D.stages });
      case "split": return json({ parts: iv && iv.readDone ? sample(iv).parts : [] });
      case "sent": return json(sent(p, a || ""));
      case "report": return file(String(b || "report.docx").replace(/\.docx$/, "-demo.txt"), demoFile("the findings report, in Word"));
    }
    throw err("Not found", 404);
  }

  // The researcher removes a theme (its findings become "not placed"), or puts it back; the list then needs approving again.
  function themeOutOrBack(p, tid, out) {
    if (p.running) throw err("A step is running. Change the theme list once it has finished.");
    if (!p.cb) throw err("Not found", 404);
    if (p.cb.frozen) throw err("The theme list is frozen: it can no longer change.");
    const cb = p.cb.data, aside = (cb.removed_by_researcher ||= []);
    if (out) {
      const t = cb.themes.find(x => x.id === tid); if (!t) throw err("Not found", 404);
      const group = (cb.groups || []).find(g => g.themes.includes(tid));
      cb.themes = cb.themes.filter(x => x !== t);
      if (group) group.themes = group.themes.filter(x => x !== tid);
      const emptied = group ? { ...group, themes: [] } : null;
      cb.groups = (cb.groups || []).filter(g => g.themes.length);
      (cb.unplaced ||= []).push(...(t.sub_themes || []).flatMap(s => s.representative_codes || [])
        .map(c => ({ code: c, reason: `Its theme was removed by you: ${t.name}`, from_theme: tid })));
      aside.push({ theme: t, group: group ? group.id : "", group_entry: emptied, at: nowIso() });
    } else {
      const entry = aside.find(r => r.theme.id === tid); if (!entry) throw err("Not found", 404);
      cb.removed_by_researcher = aside.filter(r => r !== entry);
      cb.themes.push(entry.theme);
      const group = (cb.groups || []).find(g => g.id === entry.group);
      if (group) group.themes.push(tid); else if (entry.group_entry) (cb.groups ||= []).push({ ...entry.group_entry, themes: [tid] });
      cb.unplaced = (cb.unplaced || []).filter(u => u.from_theme !== tid);
    }
    p.cb.approved = false;
  }
  function addInterview(p, body) {
    const used = new Set(p.interviews.map(iv => iv.sample));
    const next = Object.keys(D.samples).find(k => !used.has(k));
    const dup = p.interviews.find(iv => iv.original === body.filename);
    if (dup && !body.force) throw err(`${body.filename} is already in this project, as ${dup.label}.`, 409, { duplicate: true });
    if (!next) throw err("The demo has three invented interviews, and all three are already in this project. Remove one to add it again.");
    const s = D.samples[next], n = Math.max(p.next_n || 0, Math.max(0, ...p.interviews.map(iv => iv.n)) + 1);
    p.next_n = n + 1;  // never reuse a removed number
    const slug = `int${String(n).padStart(2, "0")}-${s.date}`;
    const iv = { n, slug, label: `Interview ${n}`, original: body.filename && !body.filename.startsWith("sample:") ? `${body.filename} (demo: replaced by ${s.original})` : s.original,
      file: `INT${String(n).padStart(2, "0")}-${s.date}.txt`, words: s.words, status: "extracting", message: "", sample: next,
      speaker_labels: s.speaker_labels, speakers: {}, speakers_set: false, check_approved: false, final_approved: false };
    p.interviews.push(iv);
    setTimeout(() => { iv.status = "ready"; save(); }, 1200);
  }
  function settle(p, iv, b) {
    const who = Object.values(iv.speakers).find(x => x.role === "interviewee");
    if (!who || who.profile) return;
    let pr = null;
    if (b.new_profile && String(b.new_profile.role || "").trim()) {
      pr = { id: `P${p.profiles.length + 1}`, role: b.new_profile.role, org_type: b.new_profile.org_type || "", sector: b.new_profile.sector || "" };
      p.profiles.push(pr);
    } else if (b.profile_id) pr = p.profiles.find(x => x.id === b.profile_id);
    if (pr) { who.profile = clone(pr); const m = p.data[iv.slug]?.meta; if (m) m.speaker_map[who.label] = `interviewee: ${profileText(pr)}`; }
  }

  function post(path, b) {
    if (path[0] === "claude") {
      if (path[1] === "test") return json({ ok: true, seconds: 0, message: "In the demo, Claude is simulated: in the platform, this asks Claude one short question." });
      if (path[1] === "key") throw err("The demo never saves a key. In the platform, the key stays on your own computer, outside the projects.");
      if (path[1] === "login") throw err("In the demo, there is nothing to log in to: Claude is simulated.");
      throw err("Not found", 404);
    }
    if (path.length === 1) {  // a new project
      const name = String(b.name || "").trim(), question = String(b.question || "").trim();
      if (!name || !question) throw err("A project needs a name and a research question.");
      const lines = (v) => String(v || "").split("\n").map(x => x.trim()).filter(Boolean);
      let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "project";
      while (S.projects.some(p => p.id === id)) id += "-2";
      const profs = (b.profiles || []).filter(x => String(x.role || "").trim()).map((x, i) => ({ id: `P${i + 1}`, role: x.role, org_type: x.org_type || "", sector: x.sector || "" }));
      const p = newProject(id, name, question, lines(b.sub_questions), lines(b.priors), profs);
      S.projects.unshift(p); save();
      return json(view(p));
    }

function queue(p) {

    const s = ivStatus(p, iv).step;
    if (!s || !["you", "failed"].includes(s.state)) continue;
    if (s.id === "approve-themes") { if (!themes) { themes = true; out.push({ key: "themes", slug: iv.slug, step: s, title: "Theme list" }); } continue; }
    out.push({ key: `${iv.slug}:${s.id}`, slug: iv.slug, step: s,

  }
  const pats = [...(d?.patterns || [])].sort((a, b) => (b.interviews || []).length - (a.interviews || []).length).slice(0, 5);
  if (pats.length) S.push(`<h2>Shared patterns</h2><ul class="sl-list">${pats.map(x => `<li><span class="cl"><b>${esc(x.pattern)}</b> <span class="sl-in">${(x.interviews || []).length} interviews</span></span></li>`).join("")}</ul>`);
  const div = (d?.divergences || []).slice(0, 4);
  if (div.length) S.push(`<h2>Where they differ</h2><ul class="sl-list">${div.map(x => `<li><span class="cl"><b>${esc(x.about)}</b>${esc(x.how_they_differ || "")}</span></li>`).join("")}</ul>`);
  const lim = (R?.limits || []).length ? `<ul class="sl-list">${R.limits.slice(0, 5).map(x => `<li><span class="cl"><b>${esc(x[0] || "")}</b>${esc((x.slice(1) || []).join(""))}</span></li>`).join("")}</ul>`
    : d?.limits ? `<p class="sl-big">${esc(d.limits)}</p>` : "";
  if (lim) S.push(`<h2>Limits</h2>${lim}`);
  deckSlides = S; deckI = 0;
  let deck = document.getElementById("deck");
  if (!deck) {
    deck = Object.assign(document.createElement("div"), { id: "deck" });
    deck.setAttribute("role", "dialog"); deck.setAttribute("aria-modal", "true"); deck.setAttribute("aria-label", "The results as slides");
    document.body.append(deck);
    deck.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.deck === "next") deckGo(1); else if (b.dataset.deck === "prev") deckGo(-1);
      else if (b.dataset.deck === "full") (document.fullscreenElement ? document.exitFullscreen() : deck.requestFullscreen?.())?.catch?.(() => {});
      else if (b.dataset.deck === "close") closeSlides(); });
  }
  deckOpener = document.activeElement;
  deck.hidden = false; document.body.classList.add("deck-open");
  drawSlide(); deck.querySelector("[data-deck=next]")?.focus();
}
function drawSlide() {
  const deck = document.getElementById("deck"), had = document.activeElement?.dataset?.deck;
  deck.innerHTML = `<div class="deck-top"><span>${esc(project.name)}</span><span class="grow"></span>
      <button data-deck="full" title="Full screen (F)">⛶ Full screen</button><button data-deck="close" title="Close (Esc)">✕ Close</button></div>
    <div class="slide" aria-live="polite">${deckSlides[deckI]}</div>
    <div class="deck-bot"><button data-deck="prev" ${deckI ? "" : "disabled"} aria-label="Previous slide">‹</button>
      <span class="deck-n">${deckI + 1} / ${deckSlides.length}</span><button data-deck="next" ${deckI < deckSlides.length - 1 ? "" : "disabled"} aria-label="Next slide">›</button></div>`;
  const b = deck.querySelector(`[data-deck="${had || "next"}"]:not([disabled])`) || deck.querySelector("[data-deck=prev]:not([disabled]), [data-deck=next]:not([disabled])");
  b?.focus();
}
function deckGo(step) { deckI = Math.max(0, Math.min(deckSlides.length - 1, deckI + step)); drawSlide(); }
function closeSlides() { const deck = document.getElementById("deck"); if (!deck || deck.hidden) return;
  deck.hidden = true; document.body.classList.remove("deck-open");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (deckOpener?.isConnected) deckOpener.focus(); deckOpener = null; }
document.addEventListener("keydown", (e) => {
  const deck = document.getElementById("deck");
  if (!deck || deck.hidden) return;
  const k = e.key;
  if (["ArrowRight", "PageDown", " "].includes(k)) { e.preventDefault(); e.stopImmediatePropagation(); deckGo(1); }
  else if (["ArrowLeft", "PageUp"].includes(k)) { e.preventDefault(); e.stopImmediatePropagation(); deckGo(-1); }
  else if (k === "Escape") { e.preventDefault(); closeSlides(); }
  else if (k === "f" || k === "F") { e.preventDefault(); (document.fullscreenElement ? document.exitFullscreen() : deck.requestFullscreen?.())?.catch?.(() => {}); }
}, true);
const STEP_ORDER = PHASES.flatMap(ph => ph.steps);
const GONE = '<div class="card"><p>This interview is no longer in the project.</p><button data-nav-go="project">Go to the overview</button></div>';
// Why a step stopped, in words: another interview's file, a misquote, or something else.
function stopText(s, G) {
  const r = s.reason || {};
  const found = (r.problems || []).length ? `<span class="found">The check found: ${r.problems.map(esc).join(" · ")}</span>`
    : r.stopped ? `<span class="found">${esc(r.stopped)}</span>` : "";
  if (r.others && r.others.length && !r.own)
    return `This interview's work was fine: the check stopped on a problem in ${esc(r.others.join(" and "))}. Open ${r.others.length > 1 ? "them" : "it"} and fix that first, then click “Run again” here.${found}`;
  if (r.quote) return `The agent misquoted a sentence: it is not word for word in the transcript. Click “Run again”: small slips are now set back to the transcript's words automatically.${found}`;
  return `See why it stopped, then click “Run again”. If it stops the same way twice, the fix is needed elsewhere first.${found}`;
}

        <div class="row actions"><button class="primary" data-remove="${esc(bad.slug)}">Remove it</button></div></article>`
      : cur.key === "themes" ? await screens.codebook()
      : cur.step.state === "failed" ? screens.step.call(null, cur.step.id)

      : cur.step.id === "confirm-check" ? await screens.check()
      : await screens.final();

  interview() {
    const p = project;
    // A new transcript is "pending-N" until its text is extracted and it gets its real name.
    const iv = p.interviews.find(x => x.slug === view.slug) || p.interviews.find(x => `pending-${x.n}` === view.slug);
    if (!iv) return GONE;
    if (iv.slug !== view.slug) { view.slug = iv.slug; store.set(VIEW_KEY, view); }
    const st = ivStatus(p, iv), phs = phasesOf(p, iv);
    const prof = Object.values(iv.speakers || {}).find(x => x.profile)?.profile;
    const nowPh = (st.phase || phs[phs.length - 1]).id;
    // The phase you clicked stays open until the interview moves on to another phase; then the new one opens.
    const pick = phaseSel[`${p.id}/${iv.slug}`];
    const selId = pick && pick.at === nowPh ? pick.id : nowPh, sel = phs.find(x => x.id === selId);
    const mine = (ph) => ph.steps.filter(x => x.who === "you");
    const pdec = (ph) => { const d = mine(ph); if (!d.length) return "";
      return `<span class="pdec">★ ${{ themes: "theme list", approve: "approve" }[ph.id] || `${d.length} decision${d.length > 1 ? "s" : ""}`}</span>`; };
    const bar = `<ol class="path phasebar" aria-label="The five phases of this interview">${phs.map((ph, i) => `<li class="${ph.state} ${ph.id === selId ? "sel" : ""} ${i && phs[i - 1].state === "done" ? "after-done" : ""}">
        <button data-phase="${ph.id}" aria-pressed="${ph.id === selId}" title="${esc(ph.about)}"><span class="node">${{ done: "✓", failed: "✕", you: "★" }[ph.state] || i + 1}</span><b>${ph.name}</b>${pdec(ph)}</button></li>`).join("")}</ol>`;
    const m = p.summaries?.[iv.slug] || {};
    const done = (id) => ((p.steps[iv.slug] || []).find(x => x.id === id) || {}).state === "done";
    const links = [done("check") && `<button class="small" data-go="check" data-slug="${esc(iv.slug)}">Transcript notes</button>`,
      done("readers") && `<button class="small" data-go="codes" data-slug="${esc(iv.slug)}">Findings${m.findings ? ` (${m.findings})` : ""}</button>`,
      done("latent") && `<button class="small" data-go="final" data-slug="${esc(iv.slug)}">Re-read and behind the lines</button>`].filter(Boolean);
    const head = `<section class="card"><div class="spread"><h2 class="pg" style="margin:0">${esc(iv.label)}</h2>
        <span class="muted">${esc(iv.original)}${iv.words ? ` · ${iv.words.toLocaleString()} words` : ""}</span></div>
      <div class="muted">Interviewee: ${prof ? esc(profileText(prof)) : "not given yet"}</div>
      ${links.length ? `<div class="row quick" style="margin-top:8px"><span class="muted">What the AI produced:</span>${links.join("")}</div>` : ""}
      ${bar}</section>`;
    // Each step in one line: done, running, yours or still to come, and who does it. Open it to see what it does.
    const WHO_WORD = { program: "program", agent: "agent", you: "you" };
    const isNow = (x) => st.state !== "done" && st.step && x.id === st.step.id;
    const row = (x) => {
      const G = STEP_GUIDE[x.id] || { title: x.title };
      const out = x.state === "done" && G.out ? (G.out[0] === "quotes" ? `<button class="small" data-sec="quotes" data-slug="${esc(iv.slug)}">${G.out[1]}</button>`
        : `<button class="small" data-go="${G.out[0]}" data-slug="${esc(iv.slug)}">${G.out[1]}</button>`) : "";
      const icon = `<span class="sic ${x.state}" aria-hidden="true">${{ done: "✓", running: "●", failed: "✕", you: "★", todo: "" }[x.state]}</span>`;
      const label = `<span>${x.who === "you" && !isNow(x) ? "★ " : ""}${isNow(x) ? `<b>${esc(G.title)}</b>` : esc(G.title)}
        <span class="st-who">· ${WHO_ICON[x.who]} ${WHO_WORD[x.who]}${isNow(x) ? " · now" : ""}</span></span>`;
      // The step of the moment is shown in full below, so its line here does not open.
      if (isNow(x)) return `<div class="srow now ${x.state}" id="sd-${x.id}">${icon}${label}<span class="tag ${STATE[x.state][0]}">${STATE_TXT[x.state]}</span></div>`;
      return `<details class="srow ${x.state}" id="sd-${x.id}"><summary>${icon}${label}${out || '<span class="st-who" aria-hidden="true">▾</span>'}</summary>${stepCard(iv, x)}</details>`;
    };
    const n = mine(sel).length;
    const phaseCard = `<section class="card phasecard" id="phase-${sel.id}"><div class="ph-h"><h3>${sel.name}</h3><span class="tag ${STATE[sel.state][0]}">${STATE[sel.state][1]}</span><span class="grow"></span>
        <span class="muted">${n === 0 ? "No decision of yours: the program and the agents do it" : n === 1 ? "One of your decisions is in this phase" : `${n} of your decisions are in this phase`}</span></div>
      <p class="muted" style="margin:4px 0 8px">${esc(sel.about)}</p>
      ${sel.state !== "todo" && phaseSummary(sel.id, m) ? `<div class="phase-sum" style="margin-bottom:8px">${esc(phaseSummary(sel.id, m))}</div>` : ""}
      ${sel.steps.map(row).join("")}
      <p class="muted legend" style="margin:10px 0 0">${WHO_ICON.program} program, fixed rules · ${WHO_ICON.agent} AI agent · ${WHO_ICON.you} your decision. Open a step to see what it does, why, and what it produces.</p></section>`;
    const now = st.state === "done" ? `<article class="stepcard done"><header><span class="dot done">✓</span><h3>This interview is analysed and approved</h3></header>
        <p>It is part of the cross-analysis and of the findings report.</p>
        <div class="row"><button class="primary" data-nav-go="results">Open the results</button><button data-dl="interview" data-slug="${esc(iv.slug)}">Its report (Word)</button></div></article>`
      : iv.status === "error" ? `<div class="error"><b>The file could not be read.</b> ${esc(iv.message)}</div>`
      : sel.id !== st.phase.id ? `<p class="muted">Now: <b>${esc((STEP_GUIDE[st.step.id] || st.step).title)}</b>, in the ${esc(st.phase.name)} phase.
          <button class="link" data-phase="${st.phase.id}">Show it</button></p>`
      : st.step.id === "speakers" && st.step.state === "you" ? speakersDecision(iv)
      : stepCard(iv, st.step);
    return `${errorBox()}${head}${iv.status === "error" ? "" : phaseCard}${now}
      ${!p.running || !p.running.startsWith(iv.slug + ":") ? `<p style="margin-top:18px"><button class="link danger" data-remove="${esc(iv.slug)}">Remove this interview</button></p>` : ""}`;
  },
